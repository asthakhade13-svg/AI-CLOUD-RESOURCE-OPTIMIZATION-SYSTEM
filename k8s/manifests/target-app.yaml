apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app
  namespace: default
  labels:
    app: target-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: target-app
  template:
    metadata:
      labels:
        app: target-app
    spec:
      containers:
        - name: target-app
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: target-app-service
  namespace: default
spec:
  selector:
    app: target-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
