apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-optimizer-config
  namespace: default
data:
  # Connection endpoints
  PROMETHEUS_URL: "http://prometheus-service:9090"
  API_GATEWAY_URL: "http://api-gateway-service:8000"
  ML_SERVICE_URL: "http://ml-service-service:8050"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "resource_optimization"
  DB_USER: "postgres"
  
  # Autoscaler Safety config limits
  TARGET_DEPLOYMENT: "target-app"
  MIN_REPLICAS: "2"
  MAX_REPLICAS: "10"
  SCALE_UP_COOLDOWN: "60"
  SCALE_DOWN_COOLDOWN: "180"
  MAX_SCALE_STEP: "3"
  POLL_INTERVAL: "30"
  SAFE_DEFAULT_REPLICAS: "3"
