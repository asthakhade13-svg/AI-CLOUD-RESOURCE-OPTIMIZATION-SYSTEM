apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: default
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cloud-optimizer-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloud-optimizer-db-secret
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: default
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
  type: NodePort
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-autoscaler-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-autoscaler-role
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-autoscaler-rb
  namespace: default
subjects:
  - kind: ServiceAccount
    name: ai-autoscaler-sa
    namespace: default
roleRef:
  kind: Role
  name: ai-autoscaler-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-autoscaler-controller
  namespace: default
  labels:
    app: ai-autoscaler-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-autoscaler-controller
  template:
    metadata:
      labels:
        app: ai-autoscaler-controller
    spec:
      serviceAccountName: ai-autoscaler-sa
      containers:
        - name: autoscaler
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "k8s/controller.py"]
          envFrom:
            - configMapRef:
                name: cloud-optimizer-config
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
