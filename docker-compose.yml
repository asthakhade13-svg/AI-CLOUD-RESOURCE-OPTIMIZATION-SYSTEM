version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: resource_optimizer_db
    environment:
      - POSTGRES_DB=resource_optimization
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resource_optimization"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  ml_service:
    build:
      context: .
      dockerfile: ml_service/Dockerfile
    container_name: resource_optimizer_ml
    ports:
      - "8050:8050"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8050/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: resource_optimizer_app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=resource_optimization
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - ML_SERVICE_URL=http://ml_service:8050
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
      ml_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: resource_optimizer_frontend
    ports:
      - "80:80"
    depends_on:
      - app
    restart: always

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: resource_optimizer_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml
    depends_on:
      - app
    restart: always

  grafana:
    image: grafana/grafana:10.0.3
    container_name: resource_optimizer_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: always

volumes:
  postgres_data:
