server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API endpoints to FastAPI backend
    location /predict {
        proxy_pass http://app:8000/predict;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /forecast {
        proxy_pass http://app:8000/forecast;
        proxy_set_header Host $host;
    }

    location /autoscale {
        proxy_pass http://app:8000/autoscale;
        proxy_set_header Host $host;
    }

    location /anomaly {
        proxy_pass http://app:8000/anomaly;
        proxy_set_header Host $host;
    }

    location /optimize {
        proxy_pass http://app:8000/optimize;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://app:8000/health;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://app:8000/metrics;
        proxy_set_header Host $host;
    }
}
