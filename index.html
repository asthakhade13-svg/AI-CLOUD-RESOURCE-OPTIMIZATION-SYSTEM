<!DOCTYPE html>
<html lang="en" class="dark h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Resource Optimization Console</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel Standalone to compile JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    
    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="h-full">
    <div id="error-console" style="color: #ef4444; background: #020617; font-family: monospace; padding: 20px; display: none; white-space: pre-wrap; z-index: 9999; position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box; border-bottom: 2px solid #ef4444;">
        <h3 style="margin-top: 0; display: flex; align-items: center; gap: 8px;">❌ Browser Execution Error Detected</h3>
        <div id="error-message"></div>
    </div>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            var consoleDiv = document.getElementById("error-console");
            var msgDiv = document.getElementById("error-message");
            if (consoleDiv && msgDiv) {
                consoleDiv.style.display = "block";
                msgDiv.textContent = message + "\n\nat " + source + ":" + lineno + ":" + colno + (error ? "\n\nStack:\n" + error.stack : "");
            }
            return false;
        };
    </script>
    <div id="root" class="h-full"></div>

    <!-- React App Script -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // API Endpoint configurations
        const API_URL = window.location.origin && window.location.origin !== "null" && !window.location.origin.startsWith("file://") 
            ? window.location.origin 
            : "http://127.0.0.1:8000";

        function App() {
            // Loading and connection state variables
            const [connected, setConnected] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            
            // Current input values form state
            const [inputs, setInputs] = useState({
                cpu_usage: 45.0,
                memory_usage: 50.0,
                network_traffic: 120.0,
                active_users: 180,
                current_servers: 5,
                server_cost: 0.60,
                response_time: 120.0,
                error_rate: 0.0,
                safety_margin: 0.10,
                min_servers: 1,
                max_servers: 20
            });
            
            // Latest prediction response state
            const [prediction, setPrediction] = useState(null);
            
            // Historical timeline telemetry dataset state (for charts)
            const [history, setHistory] = useState([]);

            // Multi-Objective Optimizer states
            const [activeTab, setActiveTab] = useState('capacity'); // 'capacity' or 'optimizer'
            const [optWeights, setOptWeights] = useState({
                cost: 1.0,
                latency: 1.0,
                sla: 1.0,
                carbon: 1.0,
                energy: 0.5,
                overprovisioning: 0.5,
                underprovisioning: 0.8,
                stability: 0.3
            });
            const [optResult, setOptResult] = useState(null);
            const [optLoading, setOptLoading] = useState(false);

            // Kubernetes autoscaling status state
            const [k8sStatus, setK8sStatus] = useState(null);

            // MLOps self-monitoring & retraining states
            const [mlopsStatus, setMlopsStatus] = useState(null);
            const [mlopsMetrics, setMlopsMetrics] = useState(null);
            const [mlopsDrift, setMlopsDrift] = useState(null);
            const [mlopsLoading, setMlopsLoading] = useState(false);
            const [mlopsRetrainResult, setMlopsRetrainResult] = useState(null);

            // AIOps & Incident Management states
            const [aiopsGraph, setAiopsGraph] = useState(null);
            const [aiopsIncidents, setAiopsIncidents] = useState([]);
            const [aiopsExperiments, setAiopsExperiments] = useState(null);
            const [aiopsLoading, setAiopsLoading] = useState(false);
            const [selectedFault, setSelectedFault] = useState('CPU_SATURATION');

            // Ref to track charts instances for destruction/re-draw
            const chartsRefs = {
                cpu: useRef(null),
                memory: useRef(null),
                users: useRef(null),
                capacity: useRef(null),
                response: useRef(null),
                cost: useRef(null),
                pareto: useRef(null)
            };
            const chartsInstances = useRef({});


            // 1. Initial health check and seed initial historical records
            useEffect(() => {
                checkHealth();
                // Initialize default history timeline
                const initialHistory = [];
                const now = new Date();
                for (let i = 19; i >= 0; i--) {
                    const time = new Date(now.getTime() - i * 5 * 60 * 1000);
                    initialHistory.push({
                        time: time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        cpu: 30 + Math.random() * 25,
                        memory: 40 + Math.random() * 20,
                        users: 100 + Math.floor(Math.random() * 80),
                        traffic: 80 + Math.random() * 50,
                        current_servers: 5,
                        predicted_servers: 5,
                        recommended_servers: 5,
                        cost: 3.0,
                        response_time: 90 + Math.random() * 30
                    });
                }
                setHistory(initialHistory);
                
                // Fetch first prediction
                triggerPrediction(inputs, initialHistory);
            }, []);

            // 2. Trigger ApexCharts updates whenever history changes
            useEffect(() => {
                if (history.length === 0) return;
                renderCharts();

            }, [history]);

            const checkHealth = async () => {
                try {
                    const res = await fetch(`${API_URL}/health`);
                    if (res.ok) {
                        setConnected(true);
                    } else {
                        setConnected(false);
                    }
                } catch (e) {
                    setConnected(false);
                }
            };

            const triggerPrediction = async (currentInputs, currentHistory = history) => {
                setLoading(true);
                setError(null);
                
                // Construct complete payload matching PredictRequest
                const payload = {
                    cpu_usage: parseFloat(currentInputs.cpu_usage),
                    memory_usage: parseFloat(currentInputs.memory_usage),
                    network_traffic: parseFloat(currentInputs.network_traffic),
                    active_users: parseInt(currentInputs.active_users),
                    current_servers: parseInt(currentInputs.current_servers),
                    server_cost: parseFloat(currentInputs.server_cost),
                    response_time: parseFloat(currentInputs.response_time),
                    error_rate: parseFloat(currentInputs.error_rate),
                    safety_margin: parseFloat(currentInputs.safety_margin),
                    min_servers: parseInt(currentInputs.min_servers),
                    max_servers: parseInt(currentInputs.max_servers)
                };

                try {
                    const res = await fetch(`${API_URL}/predict`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!res.ok) {
                        const errData = await res.json();
                        throw new Error(errData.detail || "API evaluation failed");
                    }
                    
                    const data = await res.json();
                    setPrediction(data);
                    setConnected(true);

                    // Update historical array sliding window
                    const now = new Date();
                    const nextHistory = [...currentHistory];
                    if (nextHistory.length >= 25) {
                        nextHistory.shift();
                    }
                    
                    nextHistory.push({
                        time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        cpu: payload.cpu_usage,
                        memory: payload.memory_usage,
                        users: payload.active_users,
                        traffic: payload.network_traffic,
                        current_servers: payload.current_servers,
                        predicted_servers: data.predicted_servers || payload.current_servers,
                        recommended_servers: data.recommended_servers || payload.current_servers,
                        cost: data.hourly_cost || 0.0,
                        response_time: payload.response_time
                    });
                    setHistory(nextHistory);
                    
                    // Update input current_servers for the next tick
                    setInputs(prev => ({
                        ...prev,
                        current_servers: data.recommended_servers || prev.current_servers
                    }));

                } catch (e) {
                    loggerError(e.message);
                    setError(e.message);
                    setPrediction(null);
                } finally {
                    setLoading(false);
                }
            };

            const loggerError = (msg) => {
                console.error("Dashboard error:", msg);
            };

            // Preset simulation templates
            const runSimulation = (templateName) => {
                let simInputs = { ...inputs };
                const currentCapacity = inputs.current_servers;
                
                if (templateName === 'traffic_spike') {
                    // Suddenly multiply load parameters
                    simInputs.cpu_usage = 89.0;
                    simInputs.memory_usage = 78.0;
                    simInputs.active_users = 950;
                    simInputs.network_traffic = 1120.0;
                    simInputs.request_rate = 1450.0;
                    simInputs.response_time = 320.0;
                    simInputs.error_rate = 1.2;
                } else if (templateName === 'memory_leak') {
                    simInputs.cpu_usage = 45.0;
                    simInputs.memory_usage = 96.0;  // saturated memory
                    simInputs.active_users = 120;
                    simInputs.response_time = 140.0;
                } else if (templateName === 'healthy') {
                    simInputs.cpu_usage = 42.0;
                    simInputs.memory_usage = 48.0;
                    simInputs.active_users = 160;
                    simInputs.network_traffic = 110.0;
                    simInputs.response_time = 110.0;
                    simInputs.error_rate = 0.0;
                }
                
                setInputs(simInputs);
                triggerPrediction(simInputs);
            };

            const triggerOptimization = async (customWeights = optWeights) => {
                setOptLoading(true);
                setError(null);
                try {
                    const reqRate = parseFloat(inputs.request_rate || (inputs.active_users * 4.2));
                    const predReq = parseInt(prediction?.recommended_servers || inputs.current_servers);
                    const payload = {
                        workload: {
                            request_rate: reqRate,
                            active_users: parseInt(inputs.active_users),
                            predicted_required_servers: predReq
                        },
                        current_configuration: {
                            replicas: parseInt(inputs.current_servers),
                            instance_type: "m5.large",
                            cpu_alloc: 2.0,
                            mem_alloc: 8.0,
                            region: "us-east-1"
                        },
                        weights: customWeights,
                        constraints: {
                            min_replicas: parseInt(inputs.min_servers),
                            max_replicas: parseInt(inputs.max_servers),
                            target_latency: 200.0,
                            max_error_rate: 1.0
                        }
                    };
                    const res = await fetch(`${API_URL}/optimizer/optimize`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error(await res.text());
                    const data = await res.json();
                    setOptResult(data);
                } catch (e) {
                    console.error("Optimization failed:", e);
                    setError("Optimization failed: " + e.message);
                } finally {
                    setOptLoading(false);
                }
            };

            const renderParetoChart = () => {
                if (!optResult || !chartsRefs.pareto.current) return;
                
                const paretoFront = optResult.pareto_front || [];
                const recommended = optResult.recommended_configuration;
                const estCost = optResult.estimated_cost;
                const estLat = optResult.estimated_latency;
                
                const seriesData = paretoFront.map(c => [parseFloat(c.cost.toFixed(4)), parseFloat(c.latency.toFixed(1))]);
                const recData = [[parseFloat(estCost.toFixed(4)), parseFloat(estLat.toFixed(1))]];
                
                const options = {
                    chart: {
                        type: 'scatter',
                        height: 250,
                        toolbar: { show: false },
                        background: 'transparent'
                    },
                    theme: { mode: 'dark' },
                    grid: { borderColor: '#1e293b', strokeDashArray: 4 },
                    series: [
                        { name: 'Pareto Candidate', data: seriesData },
                        { name: 'Recommended Config', data: recData }
                    ],
                    colors: ['#0ea5e9', '#2ecc71'],
                    markers: {
                        size: [6, 10],
                        strokeWidth: 1,
                        fillOpacity: [0.6, 1.0],
                        shape: ["circle", "square"]
                    },
                    xaxis: {
                        title: { text: 'Hourly Cost ($)', style: { color: '#94a3b8' } },
                        labels: { style: { colors: '#64748b' }, formatter: (val) => '$' + parseFloat(val).toFixed(2) }
                    },
                    yaxis: {
                        title: { text: 'Latency (ms)', style: { color: '#94a3b8' } },
                        labels: { style: { colors: '#64748b' } }
                    },
                    tooltip: {
                        theme: 'dark',
                        custom: function({ series, seriesIndex, dataPointIndex, w }) {
                            if (seriesIndex === 1) {
                                return '<div class="p-3 bg-slate-900 border border-slate-800 text-xs rounded text-slate-100 shadow-lg">' +
                                    '<b class="text-emerald-400">Selected Optimal:</b><br/>' +
                                    recommended.replicas + 'x ' + recommended.instance_type + '<br/>' +
                                    'Cost: $' + estCost.toFixed(4) + '/hr<br/>' +
                                    'Latency: ' + estLat.toFixed(1) + ' ms' +
                                    '</div>';
                            }
                            const p = paretoFront[dataPointIndex];
                            if (!p) return '';
                            return '<div class="p-3 bg-slate-900 border border-slate-800 text-xs rounded text-slate-100 shadow-lg">' +
                                '<b class="text-brand-400">' + p.replicas + 'x ' + p.instance_type + '</b> (' + p.region + ')<br/>' +
                                'CPU: ' + p.cpu_alloc + ' cores | Mem: ' + p.mem_alloc + ' GB<br/>' +
                                'Cost: $' + p.cost.toFixed(4) + '/hr<br/>' +
                                'Latency: ' + p.latency.toFixed(1) + ' ms<br/>' +
                                'Carbon: ' + p.carbon.toFixed(1) + ' gCO2/hr' +
                                '</div>';
                        }
                    },
                    legend: { show: true, labels: { colors: '#94a3b8' } }
                };
                
                if (chartsInstances.current.pareto) {
                    try {
                        chartsInstances.current.pareto.updateOptions(options);
                    } catch (err) {
                        try { chartsInstances.current.pareto.destroy(); } catch (d) {}
                        const chart = new ApexCharts(chartsRefs.pareto.current, options);
                        chart.render();
                        chartsInstances.current.pareto = chart;
                    }
                } else {
                    const chart = new ApexCharts(chartsRefs.pareto.current, options);
                    chart.render();
                    chartsInstances.current.pareto = chart;
                }
            };

            // Trigger Pareto plot on tab or result updates
            useEffect(() => {
                if (activeTab === 'optimizer' && optResult) {
                    renderParetoChart();
                }
            }, [activeTab, optResult]);

            const fetchK8sStatus = async () => {
                try {
                    const res = await fetch(`${API_URL}/k8s/status`);
                    if (res.ok) {
                        const data = await res.json();
                        setK8sStatus(data);
                    }
                } catch (e) {
                    console.warn("Failed to fetch k8s scaling status:", e);
                }
            };

            // Periodically poll Kubernetes scaling status
            useEffect(() => {
                fetchK8sStatus();
                const interval = setInterval(fetchK8sStatus, 10000);
                return () => clearInterval(interval);
            }, []);

            const fetchMlopsStatus = async () => {
                try {
                    setMlopsLoading(true);
                    const statusRes = await fetch(`${API_URL}/model/status`);
                    const metricsRes = await fetch(`${API_URL}/model/metrics`);
                    const driftRes = await fetch(`${API_URL}/model/drift`);
                    
                    if (statusRes.ok) setMlopsStatus(await statusRes.json());
                    if (metricsRes.ok) setMlopsMetrics(await metricsRes.json());
                    if (driftRes.ok) setMlopsDrift(await driftRes.json());
                } catch (e) {
                    console.warn("Failed to fetch MLOps stats:", e);
                } finally {
                    setMlopsLoading(false);
                }
            };

            const triggerMlopsRetrain = async (force = false) => {
                try {
                    setMlopsLoading(true);
                    setMlopsRetrainResult(null);
                    const res = await fetch(`${API_URL}/model/retrain`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ force: force, authorized: true })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setMlopsRetrainResult(data);
                        fetchMlopsStatus();
                    } else {
                        alert("Retraining failed: " + await res.text());
                    }
                } catch (e) {
                    console.error("Retraining error:", e);
                } finally {
                    setMlopsLoading(false);
                }
            };

            const triggerMlopsRollback = async () => {
                try {
                    if (!confirm("Are you sure you want to rollback to the previous stable version? This will swap the active model in memory.")) return;
                    setMlopsLoading(true);
                    const res = await fetch(`${API_URL}/model/rollback`, { method: 'POST' });
                    if (res.ok) {
                        const data = await res.json();
                        alert(data.reason || "Rollback completed!");
                        fetchMlopsStatus();
                    } else {
                        alert("Rollback failed: " + await res.text());
                    }
                } catch (e) {
                    console.error("Rollback error:", e);
                } finally {
                    setMlopsLoading(false);
                }
            };

            const fetchAiopsData = async () => {
                try {
                    setAiopsLoading(true);
                    const graphRes = await fetch(`${API_URL}/aiops/graph`);
                    const incidentsRes = await fetch(`${API_URL}/aiops/incidents`);
                    const expRes = await fetch(`${API_URL}/aiops/experiments`);
                    
                    if (graphRes.ok) setAiopsGraph(await graphRes.json());
                    if (incidentsRes.ok) setAiopsIncidents(await incidentsRes.json());
                    if (expRes.ok) setAiopsExperiments(await expRes.json());
                } catch (e) {
                    console.warn("Failed to fetch AIOps telemetry:", e);
                } finally {
                    setAiopsLoading(false);
                }
            };

            const injectFault = async () => {
                try {
                    setAiopsLoading(true);
                    const res = await fetch(`${API_URL}/aiops/fault_inject`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fault_type: selectedFault })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        alert(`Fault successfully injected!\nIncident: ${data.incident}\nRoot Cause: ${data.root_cause}`);
                        fetchAiopsData();
                    } else {
                        alert("Fault injection failed: " + await res.text());
                    }
                } catch (e) {
                    console.error("Fault injection error:", e);
                } finally {
                    setAiopsLoading(false);
                }
            };

            const resolveIncident = async (incidentId) => {
                try {
                    setAiopsLoading(true);
                    const res = await fetch(`${API_URL}/aiops/resolve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ incident_id: incidentId })
                    });
                    if (res.ok) {
                        alert("Incident resolved. Service metrics restored to baseline.");
                        fetchAiopsData();
                    } else {
                        alert("Failed to resolve incident: " + await res.text());
                    }
                } catch (e) {
                    console.error("Resolution error:", e);
                } finally {
                    setAiopsLoading(false);
                }
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setInputs(prev => ({
                    ...prev,
                    [name]: value
                }));
            };

            const renderCharts = () => {
                const times = history.map(h => h.time);
                
                // Chart Options template
                const baseOptions = {
                    chart: {
                        type: 'line',
                        height: '100%',
                        toolbar: { show: false },
                        animations: { enabled: true, easing: 'easeinout', speed: 400 },
                        background: 'transparent'
                    },
                    theme: { mode: 'dark' },
                    stroke: { curve: 'smooth', width: 2 },
                    grid: { borderColor: '#1e293b', strokeDashArray: 4 },
                    xaxis: { categories: times, labels: { style: { colors: '#64748b' } } },
                    yaxis: { labels: { style: { colors: '#64748b' } } },
                    tooltip: { theme: 'dark' },
                    legend: { show: true, position: 'top', horizontalAlign: 'right', labels: { colors: '#94a3b8' } }
                };

                const updateOrCreate = (key, element, options) => {
                    if (!element) return;
                    if (chartsInstances.current[key]) {
                        try {
                            chartsInstances.current[key].updateOptions(options);
                        } catch (err) {
                            console.warn("Chart update failed, recreating:", key, err);
                            try {
                                chartsInstances.current[key].destroy();
                            } catch (dErr) {}
                            const chart = new ApexCharts(element, options);
                            chart.render();
                            chartsInstances.current[key] = chart;
                        }
                    } else {
                        const chart = new ApexCharts(element, options);
                        chart.render();
                        chartsInstances.current[key] = chart;
                    }
                };

                // 1. CPU Chart
                updateOrCreate('cpu', chartsRefs.cpu.current, {
                    ...baseOptions,
                    series: [{ name: 'CPU Usage (%)', data: history.map(h => h.cpu) }],
                    colors: ['#0ea5e9'],
                    yaxis: { min: 0, max: 100, labels: { style: { colors: '#64748b' } } }
                });

                // 2. Memory Chart
                updateOrCreate('memory', chartsRefs.memory.current, {
                    ...baseOptions,
                    series: [{ name: 'Memory Usage (%)', data: history.map(h => h.memory) }],
                    colors: ['#a855f7'],
                    yaxis: { min: 0, max: 100, labels: { style: { colors: '#64748b' } } }
                });

                // 3. Active Users Chart
                updateOrCreate('users', chartsRefs.users.current, {
                    ...baseOptions,
                    series: [{ name: 'Active Sessions', data: history.map(h => h.users) }],
                    colors: ['#10b981']
                });

                // 4. Capacity Chart (Current vs Predicted vs Recommended)
                updateOrCreate('capacity', chartsRefs.capacity.current, {
                    ...baseOptions,
                    series: [
                        { name: 'Current Servers', data: history.map(h => h.current_servers) },
                        { name: 'Predicted Sizing', data: history.map(h => h.predicted_servers) },
                        { name: 'Recommended Sizing', data: history.map(h => h.recommended_servers) }
                    ],
                    colors: ['#64748b', '#0ea5e9', '#10b981'],
                    stroke: { curve: 'stepline', width: 2 }
                });

                // 5. Response Latency vs SLA
                updateOrCreate('response', chartsRefs.response.current, {
                    ...baseOptions,
                    series: [
                        { name: 'Response Time (ms)', data: history.map(h => h.response_time) },
                        { name: 'SLA Limit (ms)', data: history.map(h => 200) }
                    ],
                    colors: ['#f59e0b', '#ef4444'],
                    stroke: { curve: 'smooth', width: [2, 1.5], dashArray: [0, 4] }
                });

                // 6. Cost Sizing Slices
                updateOrCreate('cost', chartsRefs.cost.current, {
                    ...baseOptions,
                    series: [{ name: 'Hourly Cost ($)', data: history.map(h => h.cost) }],
                    colors: ['#ec4899']
                });
            };

            const getSeverityColor = (sev) => {
                switch(sev) {
                    case 'CRITICAL': return 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                    case 'HIGH': return 'bg-orange-500/10 text-orange-400 border-orange-500/20';
                    case 'MEDIUM': return 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                    default: return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';

                                                    <div className={`w-64 border bg-slate-950 p-4 rounded-xl shadow-lg transition duration-300 ${aiopsGraph.Frontend.health === 'healthy' ? 'border-emerald-500/30 hover:border-emerald-500' : aiopsGraph.Frontend.health === 'degraded' ? 'border-amber-500/50 hover:border-amber-500 animate-pulse' : 'border-rose-500 hover:border-rose-500 animate-bounce'}`}>
                                                        <div className="flex justify-between items-center border-b border-slate-900 pb-1.5 mb-2">
                                                            <span className="text-xs font-bold text-slate-200">🖥️ {aiopsGraph.Frontend.name}</span>
                                                            <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold uppercase ${aiopsGraph.Frontend.health === 'healthy' ? 'bg-emerald-500/10 text-emerald-400' : aiopsGraph.Frontend.health === 'degraded' ? 'bg-amber-500/10 text-amber-400' : 'bg-rose-500/10 text-rose-400'}`}>
                                                                {aiopsGraph.Frontend.health}
                                                            </span>
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-x-2 gap-y-1 text-[10px] font-mono text-slate-400">
                                                            <div>CPU: {aiopsGraph.Frontend.cpu.toFixed(1)}%</div>
                                                            <div>Mem: {aiopsGraph.Frontend.memory.toFixed(1)}%</div>
                                                            <div className="text-amber-400 font-bold">Latency: {aiopsGraph.Frontend.latency.toFixed(1)}ms</div>
                                                            <div className="text-rose-400">Errors: {aiopsGraph.Frontend.error_rate.toFixed(2)}%</div>
                                                            <div className="col-span-2 text-slate-500">Traffic: {aiopsGraph.Frontend.traffic.toFixed(0)} rps</div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Connector arrow */}
                                            <div className="text-center text-slate-700 text-xs">▼</div>

                                            {/* API Gateway Tier */}
                                            <div className="flex justify-center">
                                                {aiopsGraph?.API && (
                                                    <div className={`w-64 border bg-slate-950 p-4 rounded-xl shadow-lg transition duration-300 ${aiopsGraph.API.health === 'healthy' ? 'border-emerald-500/30 hover:border-emerald-500' : aiopsGraph.API.health === 'degraded' ? 'border-amber-500/50 hover:border-amber-500 animate-pulse' : 'border-rose-500 hover:border-rose-500 animate-bounce'}`}>
                                                        <div className="flex justify-between items-center border-b border-slate-900 pb-1.5 mb-2">
                                                            <span className="text-xs font-bold text-slate-200">🔌 {aiopsGraph.API.name}</span>
                                                            <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold uppercase ${aiopsGraph.API.health === 'healthy' ? 'bg-emerald-500/10 text-emerald-400' : aiopsGraph.API.health === 'degraded' ? 'bg-amber-500/10 text-amber-400' : 'bg-rose-500/10 text-rose-400'}`}>
                                                                {aiopsGraph.API.health}
                                                            </span>
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-x-2 gap-y-1 text-[10px] font-mono text-slate-400">
                                                            <div>CPU: {aiopsGraph.API.cpu.toFixed(1)}%</div>
                                                            <div>Mem: {aiopsGraph.API.memory.toFixed(1)}%</div>
                                                            <div className="text-amber-400 font-bold">Latency: {aiopsGraph.API.latency.toFixed(1)}ms</div>
                                                            <div className="text-rose-400">Errors: {aiopsGraph.API.error_rate.toFixed(2)}%</div>
                                                            <div className="col-span-2 text-slate-500">Traffic: {aiopsGraph.API.traffic.toFixed(0)} rps</div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Branched Connector arrows */}
                                            <div className="flex justify-around px-24 text-slate-700 text-xs">
                                                <span>↙</span>
                                                <span>↘</span>
                                            </div>

                                            {/* Backend Services Tier */}
                                            <div className="flex justify-around gap-4">
                                                {aiopsGraph?.Authentication && (
                                                    <div className={`w-52 border bg-slate-950 p-4 rounded-xl shadow-lg transition duration-300 ${aiopsGraph.Authentication.health === 'healthy' ? 'border-emerald-500/30 hover:border-emerald-500' : aiopsGraph.Authentication.health === 'degraded' ? 'border-amber-500/50 hover:border-amber-500 animate-pulse' : 'border-rose-500 hover:border-rose-500 animate-bounce'}`}>
                                                        <div className="flex justify-between items-center border-b border-slate-900 pb-1.5 mb-2">
                                                            <span className="text-[11px] font-bold text-slate-200">🔐 Auth Node</span>
                                                            <span className={`text-[9px] px-1 py-0.5 rounded font-bold uppercase ${aiopsGraph.Authentication.health === 'healthy' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>
                                                                {aiopsGraph.Authentication.health}
                                                            </span>
                                                        </div>
                                                        <div className="grid grid-cols-1 gap-1 text-[9px] font-mono text-slate-400">
                                                            <div>CPU: {aiopsGraph.Authentication.cpu.toFixed(1)}% | Mem: {aiopsGraph.Authentication.memory.toFixed(1)}%</div>
                                                            <div className="text-amber-400">Latency: {aiopsGraph.Authentication.latency.toFixed(1)}ms</div>
                                                            <div className="text-rose-400 font-bold">Errors: {aiopsGraph.Authentication.error_rate.toFixed(1)}%</div>
                                                        </div>
                                                    </div>
                                                )}

                                                {aiopsGraph?.Database && (
                                                    <div className={`w-52 border bg-slate-950 p-4 rounded-xl shadow-lg transition duration-300 ${aiopsGraph.Database.health === 'healthy' ? 'border-emerald-500/30 hover:border-emerald-500' : aiopsGraph.Database.health === 'degraded' ? 'border-amber-500/50 hover:border-amber-500 animate-pulse' : 'border-rose-500 hover:border-rose-500 animate-bounce'}`}>
                                                        <div className="flex justify-between items-center border-b border-slate-900 pb-1.5 mb-2">
                                                            <span className="text-[11px] font-bold text-slate-200">🗄️ Database</span>
                                                            <span className={`text-[9px] px-1 py-0.5 rounded font-bold uppercase ${aiopsGraph.Database.health === 'healthy' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>
                                                                {aiopsGraph.Database.health}
                                                            </span>
                                                        </div>
                                                        <div className="grid grid-cols-1 gap-1 text-[9px] font-mono text-slate-400">
                                                            <div>CPU: {aiopsGraph.Database.cpu.toFixed(1)}% | Mem: {aiopsGraph.Database.memory.toFixed(1)}%</div>
                                                            <div className="text-amber-400 font-bold">Latency: {aiopsGraph.Database.latency.toFixed(1)}ms</div>
                                                            <div className="text-rose-400">Errors: {aiopsGraph.Database.error_rate.toFixed(1)}%</div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            {/* Final Connector Arrow */}
                                            <div className="flex justify-end pr-36 text-slate-700 text-xs">▼</div>

                                            {/* Cache Tier */}
                                            <div className="flex justify-end pr-10">
                                                {aiopsGraph?.["Cache / Storage"] && (
                                                    <div className={`w-52 border bg-slate-950 p-4 rounded-xl shadow-lg transition duration-300 ${aiopsGraph["Cache / Storage"].health === 'healthy' ? 'border-emerald-500/30 hover:border-emerald-500' : 'border-rose-500 hover:border-rose-500 animate-bounce'}`}>
                                                        <div className="flex justify-between items-center border-b border-slate-900 pb-1.5 mb-2">
                                                            <span className="text-[11px] font-bold text-slate-200">💾 Redis Cache</span>
                                                            <span className={`text-[9px] px-1 py-0.5 rounded font-bold uppercase ${aiopsGraph["Cache / Storage"].health === 'healthy' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>
                                                                {aiopsGraph["Cache / Storage"].health}
                                                            </span>
                                                        </div>
                                                        <div className="grid grid-cols-1 gap-1 text-[9px] font-mono text-slate-400">
                                                            <div>Mem: {aiopsGraph["Cache / Storage"].memory.toFixed(1)}% | Latency: {aiopsGraph["Cache / Storage"].latency.toFixed(1)}ms</div>
                                                            <div className="text-rose-400">Errors: {aiopsGraph["Cache / Storage"].error_rate.toFixed(1)}%</div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Incident Center & Timeline Feed */}
                                    <div className="lg:col-span-1 border border-slate-900 bg-slate-900/20 rounded-xl p-5 space-y-4">
                                        <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-900 pb-3 flex items-center gap-2">
                                            <span className="h-2.5 w-2.5 rounded-full bg-rose-500 animate-ping"></span>
                                            Active Incidents Alert Feed
                                        </h3>
                                        
                                        {aiopsIncidents.length === 0 ? (
                                            <div className="text-center py-12 text-slate-500 text-xs italic">
                                                No active incidents. Dependency graph operating normally.
                                            </div>
                                        ) : (
                                            <div className="space-y-4 overflow-y-auto max-h-[500px] pr-1">
                                                {aiopsIncidents.map((inc, i) => (
                                                    <div key={i} className={`p-4 rounded-xl border space-y-3 ${inc.status === 'active' ? 'bg-rose-950/15 border-rose-900/50' : 'bg-slate-900/15 border-slate-900'}`}>
                                                        <div className="flex justify-between items-start">
                                                            <div className="space-y-0.5">
                                                                <span className="font-mono text-[10px] text-slate-500">{inc.id} | {inc.timestamp.split('T')[1].split('.')[0]}</span>
                                                                <h4 className="text-xs font-bold text-slate-200 leading-snug">{inc.incident}</h4>
                                                            </div>
                                                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${inc.severity === 'CRITICAL' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}`}>
                                                                {inc.severity}
                                                            </span>
                                                        </div>

                                                        {/* RCA Details */}
                                                        <div className="bg-slate-950/65 rounded-lg p-3 text-[11px] space-y-2 border border-slate-900">
                                                            <div className="flex justify-between">
                                                                <span className="text-slate-400 font-semibold">🔍 Likely Root Cause:</span>
                                                                <span className="text-rose-400 font-bold font-mono">{inc.root_cause}</span>
                                                            </div>
                                                            <div className="flex justify-between">
                                                                <span className="text-slate-400">Confidence Score:</span>
                                                                <span className="text-brand-400 font-mono font-bold">{(inc.confidence * 100).toFixed(0)}%</span>
                                                            </div>
                                                            <div className="flex justify-between">
                                                                <span className="text-slate-400">SLA Impact Risk:</span>
                                                                <span className="text-rose-400 font-mono">{inc.sla_impact_pct}% SLA Pen.</span>
                                                            </div>
                                                            <div className="border-t border-slate-900 pt-1.5 mt-1.5 space-y-1">
                                                                <div className="text-[10px] text-slate-400 font-bold uppercase">Evidence Log Matches:</div>
                                                                {inc.evidence.map((ev, k) => (
                                                                    <div key={k} className="text-[10px] text-slate-500 italic">• {ev}</div>
                                                                ))}
                                                            </div>
                                                        </div>

                                                        {/* Action & Resolution */}
                                                        <div className="flex gap-2">
                                                            {inc.status === 'active' ? (
                                                                <>
                                                                    <button onClick={() => resolveIncident(inc.id)} className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs rounded-lg py-2 transition duration-200">
                                                                        Auto-Remediate
                                                                    </button>
                                                                    <div className="px-2.5 py-2 bg-slate-950 rounded-lg text-[10px] text-amber-400 font-mono border border-slate-900 flex items-center justify-center">
                                                                        👉 {inc.recommended_action}
                                                                    </div>
                                                                </>
                                                            ) : (
                                                                <span className="text-[10px] text-emerald-400 font-bold font-mono flex items-center gap-1">
                                                                    ✓ Resolved at {inc.resolved_at.split('T')[1].split('.')[0]}
                                                                </span>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Chaos Experiments Benchmarking Reports */}
                                <div className="border border-slate-900 bg-slate-900/10 rounded-xl p-5 space-y-4">
                                    <h3 className="text-xs font-semibold text-slate-400 uppercase tracking-wider">
                                        Active Remediation & Chaos Experiments Benchmarks
                                    </h3>
                                    
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        <div className="lg:col-span-2 overflow-x-auto">
                                            <table className="w-full text-left text-xs border-collapse">
                                                <thead>
                                                    <tr className="border-b border-slate-800 text-slate-400 font-bold">
                                                        <th className="py-2">Policy Layer</th>
                                                        <th className="py-2">Detection Latency</th>
                                                        <th className="py-2">RCA Isolation</th>
                                                        <th className="py-2">Total Recovery Time</th>
                                                        <th className="py-2 text-center">SLA Violations</th>
                                                        <th className="py-2 text-center">Cost Index</th>
                                                        <th className="py-2 text-center">Scaling Events</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {aiopsExperiments?.scenarios.map((sc, index) => (
                                                        <tr key={index} className="border-b border-slate-900 text-slate-200">
                                                            <td className="py-3 font-semibold text-brand-400">{sc.policy}</td>
                                                            <td className="py-3 font-mono">{sc.detection_time_sec.toFixed(1)}s</td>
                                                            <td className="py-3 font-mono">{sc.root_cause_id_time_sec.toFixed(1)}s</td>
                                                            <td className="py-3 font-mono text-emerald-400">{sc.recovery_time_sec.toFixed(1)}s</td>
                                                            <td className="py-3 text-center text-rose-400 font-bold font-mono">{sc.sla_violations}</td>
                                                            <td className="py-3 text-center font-mono">{sc.cost_multiplier.toFixed(2)}x</td>
                                                            <td className="py-3 text-center font-mono">{sc.scaling_events}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                        <div className="lg:col-span-1 bg-slate-950/40 border border-slate-900 p-4 rounded-xl space-y-2">
                                            <h4 className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">AIOps Benchmark Takeaways:</h4>
                                            <div className="space-y-2 text-[10px] text-slate-500 leading-relaxed">
                                                {aiopsExperiments?.evidence.map((ev, i) => (
                                                    <p key={i}>• {ev}</p>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );

        }

        // Render React components to DOM root
        const rootElement = document.getElementById("root");
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
