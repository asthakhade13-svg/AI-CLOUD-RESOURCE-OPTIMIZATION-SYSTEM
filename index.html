<!DOCTYPE html>
<html lang="en" class="dark h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Resource Optimization Console</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel Standalone to compile JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #020617;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="h-full">
    <div id="root" class="h-full"></div>

    <!-- React App Script -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // API Endpoint configurations
        const API_URL = window.location.origin && window.location.origin !== "null" && !window.location.origin.startsWith("file://") 
            ? window.location.origin 
            : "http://127.0.0.1:8000";

        function App() {
            // Loading and connection state variables
            const [connected, setConnected] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            
            // Current input values form state
            const [inputs, setInputs] = useState({
                cpu_usage: 45.0,
                memory_usage: 50.0,
                network_traffic: 120.0,
                active_users: 180,
                current_servers: 5,
                server_cost: 0.60,
                response_time: 120.0,
                error_rate: 0.0,
                safety_margin: 0.10,
                min_servers: 1,
                max_servers: 20
            });
            
            // Latest prediction response state
            const [prediction, setPrediction] = useState(null);
            
            // Historical timeline telemetry dataset state (for charts)
            const [history, setHistory] = useState([]);
            
            // Ref to track charts instances for destruction/re-draw
            const chartsRefs = {
                cpu: useRef(null),
                memory: useRef(null),
                users: useRef(null),
                capacity: useRef(null),
                response: useRef(null),
                cost: useRef(null)
            };
            const chartsInstances = useRef({});

            // 1. Initial health check and seed initial historical records
            useEffect(() => {
                checkHealth();
                // Initialize default history timeline
                const initialHistory = [];
                const now = new Date();
                for (let i = 19; i >= 0; i--) {
                    const time = new Date(now.getTime() - i * 5 * 60 * 1000);
                    initialHistory.push({
                        time: time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        cpu: 30 + Math.random() * 25,
                        memory: 40 + Math.random() * 20,
                        users: 100 + Math.floor(Math.random() * 80),
                        traffic: 80 + Math.random() * 50,
                        current_servers: 5,
                        predicted_servers: 5,
                        recommended_servers: 5,
                        cost: 3.0,
                        response_time: 90 + Math.random() * 30
                    });
                }
                setHistory(initialHistory);
                
                // Fetch first prediction
                triggerPrediction(inputs, initialHistory);
            }, []);

            // 2. Trigger ApexCharts updates whenever history changes
            useEffect(() => {
                if (history.length === 0) return;
                renderCharts();
                 // Initialize lucide icons after DOM renders
                 setTimeout(() => {
                     if (window.lucide) {
                         window.lucide.createIcons();
                     }
                 }, 50);
            }, [history]);

            const checkHealth = async () => {
                try {
                    const res = await fetch(`${API_URL}/health`);
                    if (res.ok) {
                        setConnected(true);
                    } else {
                        setConnected(false);
                    }
                } catch (e) {
                    setConnected(false);
                }
            };

            const triggerPrediction = async (currentInputs, currentHistory = history) => {
                setLoading(true);
                setError(null);
                
                // Construct complete payload matching PredictRequest
                const payload = {
                    cpu_usage: parseFloat(currentInputs.cpu_usage),
                    memory_usage: parseFloat(currentInputs.memory_usage),
                    network_traffic: parseFloat(currentInputs.network_traffic),
                    active_users: parseInt(currentInputs.active_users),
                    current_servers: parseInt(currentInputs.current_servers),
                    server_cost: parseFloat(currentInputs.server_cost),
                    response_time: parseFloat(currentInputs.response_time),
                    error_rate: parseFloat(currentInputs.error_rate),
                    safety_margin: parseFloat(currentInputs.safety_margin),
                    min_servers: parseInt(currentInputs.min_servers),
                    max_servers: parseInt(currentInputs.max_servers)
                };

                try {
                    const res = await fetch(`${API_URL}/predict`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!res.ok) {
                        const errData = await res.json();
                        throw new Error(errData.detail || "API evaluation failed");
                    }
                    
                    const data = await res.json();
                    setPrediction(data);
                    setConnected(true);

                    // Update historical array sliding window
                    const now = new Date();
                    const nextHistory = [...currentHistory];
                    if (nextHistory.length >= 25) {
                        nextHistory.shift();
                    }
                    
                    nextHistory.push({
                        time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        cpu: payload.cpu_usage,
                        memory: payload.memory_usage,
                        users: payload.active_users,
                        traffic: payload.network_traffic,
                        current_servers: payload.current_servers,
                        predicted_servers: data.predicted_servers || payload.current_servers,
                        recommended_servers: data.recommended_servers || payload.current_servers,
                        cost: data.hourly_cost || 0.0,
                        response_time: payload.response_time
                    });
                    setHistory(nextHistory);
                    
                    // Update input current_servers for the next tick
                    setInputs(prev => ({
                        ...prev,
                        current_servers: data.recommended_servers || prev.current_servers
                    }));

                } catch (e) {
                    loggerError(e.message);
                    setError(e.message);
                    setPrediction(null);
                } finally {
                    setLoading(false);
                }
            };

            const loggerError = (msg) => {
                console.error("Dashboard error:", msg);
            };

            // Preset simulation templates
            const runSimulation = (templateName) => {
                let simInputs = { ...inputs };
                const currentCapacity = inputs.current_servers;
                
                if (templateName === 'traffic_spike') {
                    // Suddenly multiply load parameters
                    simInputs.cpu_usage = 89.0;
                    simInputs.memory_usage = 78.0;
                    simInputs.active_users = 950;
                    simInputs.network_traffic = 1120.0;
                    simInputs.request_rate = 1450.0;
                    simInputs.response_time = 320.0;
                    simInputs.error_rate = 1.2;
                } else if (templateName === 'memory_leak') {
                    simInputs.cpu_usage = 45.0;
                    simInputs.memory_usage = 96.0;  // saturated memory
                    simInputs.active_users = 120;
                    simInputs.response_time = 140.0;
                } else if (templateName === 'healthy') {
                    simInputs.cpu_usage = 42.0;
                    simInputs.memory_usage = 48.0;
                    simInputs.active_users = 160;
                    simInputs.network_traffic = 110.0;
                    simInputs.response_time = 110.0;
                    simInputs.error_rate = 0.0;
                }
                
                setInputs(simInputs);
                triggerPrediction(simInputs);
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setInputs(prev => ({
                    ...prev,
                    [name]: value
                }));
            };

            const renderCharts = () => {
                const times = history.map(h => h.time);
                
                // Chart Options template
                const baseOptions = {
                    chart: {
                        type: 'line',
                        height: '100%',
                        toolbar: { show: false },
                        animations: { enabled: true, easing: 'easeinout', speed: 400 },
                        background: 'transparent'
                    },
                    theme: { mode: 'dark' },
                    stroke: { curve: 'smooth', width: 2 },
                    grid: { borderColor: '#1e293b', strokeDashArray: 4 },
                    xaxis: { categories: times, labels: { style: { colors: '#64748b' } } },
                    yaxis: { labels: { style: { colors: '#64748b' } } },
                    tooltip: { theme: 'dark' },
                    legend: { show: true, position: 'top', horizontalAlign: 'right', labels: { colors: '#94a3b8' } }
                };

                const updateOrCreate = (key, element, options) => {
                    if (!element) return;
                    if (chartsInstances.current[key]) {
                        try {
                            chartsInstances.current[key].updateOptions(options);
                        } catch (err) {
                            console.warn("Chart update failed, recreating:", key, err);
                            try {
                                chartsInstances.current[key].destroy();
                            } catch (dErr) {}
                            const chart = new ApexCharts(element, options);
                            chart.render();
                            chartsInstances.current[key] = chart;
                        }
                    } else {
                        const chart = new ApexCharts(element, options);
                        chart.render();
                        chartsInstances.current[key] = chart;
                    }
                };

                // 1. CPU Chart
                updateOrCreate('cpu', chartsRefs.cpu.current, {
                    ...baseOptions,
                    series: [{ name: 'CPU Usage (%)', data: history.map(h => h.cpu) }],
                    colors: ['#0ea5e9'],
                    yaxis: { min: 0, max: 100, labels: { style: { colors: '#64748b' } } }
                });

                // 2. Memory Chart
                updateOrCreate('memory', chartsRefs.memory.current, {
                    ...baseOptions,
                    series: [{ name: 'Memory Usage (%)', data: history.map(h => h.memory) }],
                    colors: ['#a855f7'],
                    yaxis: { min: 0, max: 100, labels: { style: { colors: '#64748b' } } }
                });

                // 3. Active Users Chart
                updateOrCreate('users', chartsRefs.users.current, {
                    ...baseOptions,
                    series: [{ name: 'Active Sessions', data: history.map(h => h.users) }],
                    colors: ['#10b981']
                });

                // 4. Capacity Chart (Current vs Predicted vs Recommended)
                updateOrCreate('capacity', chartsRefs.capacity.current, {
                    ...baseOptions,
                    series: [
                        { name: 'Current Servers', data: history.map(h => h.current_servers) },
                        { name: 'Predicted Sizing', data: history.map(h => h.predicted_servers) },
                        { name: 'Recommended Sizing', data: history.map(h => h.recommended_servers) }
                    ],
                    colors: ['#64748b', '#0ea5e9', '#10b981'],
                    stroke: { curve: 'stepline', width: 2 }
                });

                // 5. Response Latency vs SLA
                updateOrCreate('response', chartsRefs.response.current, {
                    ...baseOptions,
                    series: [
                        { name: 'Response Time (ms)', data: history.map(h => h.response_time) },
                        { name: 'SLA Limit (ms)', data: history.map(h => 200) }
                    ],
                    colors: ['#f59e0b', '#ef4444'],
                    stroke: { curve: 'smooth', width: [2, 1.5], dashArray: [0, 4] }
                });

                // 6. Cost Sizing Slices
                updateOrCreate('cost', chartsRefs.cost.current, {
                    ...baseOptions,
                    series: [{ name: 'Hourly Cost ($)', data: history.map(h => h.cost) }],
                    colors: ['#ec4899']
                });
            };

            const getSeverityColor = (sev) => {
                switch(sev) {
                    case 'CRITICAL': return 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                    case 'HIGH': return 'bg-orange-500/10 text-orange-400 border-orange-500/20';
                    case 'MEDIUM': return 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                    default: return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                }
            };

            return (
                <div class="flex flex-col h-full bg-slate-950">
                    
                    {/* Header */}
                    <header class="flex flex-col sm:flex-row items-start sm:items-center justify-between px-6 py-4 border-b border-slate-900 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
                        <div class="flex items-center gap-3">
                            <div class="p-2 bg-brand-500/10 text-brand-500 rounded-lg">
                                <i data-lucide="cloud" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h1 class="text-lg font-semibold tracking-tight">AI Cloud Resource Optimization Console</h1>
                                <p class="text-xs text-slate-400">Enterprise Orchestration Engine</p>
                            </div>
                        </div>
                        
                        <div class="flex flex-wrap items-center gap-4 mt-3 sm:mt-0">
                            {/* Connection Indicator */}
                            <div class="flex items-center gap-2 px-3 py-1.5 rounded-full border border-slate-800 bg-slate-900">
                                <span class={`h-2.5 w-2.5 rounded-full ${connected ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}`}></span>
                                <span class="text-xs font-medium text-slate-300">
                                    {connected ? 'System Connected' : 'Offline / Re-connecting'}
                                </span>
                            </div>
                            <div class="text-xs text-slate-500 font-mono">v10.0.0</div>
                        </div>
                    </header>

                    {/* Main Container Layout */}
                    <div class="flex-1 overflow-y-auto px-6 py-6 space-y-6">
                        
                        {/* Simulation & Controls Top Panel */}
                        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                            
                            {/* Telemetry Input Panel */}
                            <div class="lg:col-span-3 border border-slate-900 bg-slate-900/20 rounded-xl p-5 space-y-4">
                                <div class="flex items-center justify-between border-b border-slate-900 pb-3">
                                    <div class="flex items-center gap-2">
                                        <i data-lucide="sliders" class="w-4 h-4 text-brand-500"></i>
                                        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Real-Time Telemetry Control</h2>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onClick={() => runSimulation('healthy')} class="px-2.5 py-1 text-xs font-medium bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/20 rounded">
                                            Normal Load
                                        </button>
                                        <button onClick={() => runSimulation('traffic_spike')} class="px-2.5 py-1 text-xs font-medium bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 rounded">
                                            Spike Surge
                                        </button>
                                        <button onClick={() => runSimulation('memory_leak')} class="px-2.5 py-1 text-xs font-medium bg-purple-500/10 hover:bg-purple-500/20 text-purple-400 border border-purple-500/20 rounded">
                                            Mem Leak
                                        </button>
                                    </div>
                                </div>
                                
                                <form onSubmit={(e) => { e.preventDefault(); triggerPrediction(inputs); }} class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                    <div>
                                        <label class="block text-xs font-medium text-slate-400 mb-1">CPU Usage (%)</label>
                                        <input type="number" step="0.1" name="cpu_usage" value={inputs.cpu_usage} onChange={handleInputChange} class="w-full bg-slate-950 border border-slate-800 focus:border-brand-500 rounded-lg px-3 py-1.5 text-sm text-slate-100 outline-none" />
                                    </div>
                                    <div>
                                        <label class="block text-xs font-medium text-slate-400 mb-1">Memory (%)</label>
                                        <input type="number" step="0.1" name="memory_usage" value={inputs.memory_usage} onChange={handleInputChange} class="w-full bg-slate-950 border border-slate-800 focus:border-brand-500 rounded-lg px-3 py-1.5 text-sm text-slate-100 outline-none" />
                                    </div>
                                    <div>
                                        <label class="block text-xs font-medium text-slate-400 mb-1">Traffic (Mbps)</label>
                                        <input type="number" step="0.1" name="network_traffic" value={inputs.network_traffic} onChange={handleInputChange} class="w-full bg-slate-950 border border-slate-800 focus:border-brand-500 rounded-lg px-3 py-1.5 text-sm text-slate-100 outline-none" />
                                    </div>
                                    <div>
                                        <label class="block text-xs font-medium text-slate-400 mb-1">Active Users</label>
                                        <input type="number" name="active_users" value={inputs.active_users} onChange={handleInputChange} class="w-full bg-slate-950 border border-slate-800 focus:border-brand-500 rounded-lg px-3 py-1.5 text-sm text-slate-100 outline-none" />
                                    </div>
                                    <div>
                                        <label class="block text-xs font-medium text-slate-400 mb-1">Current Servers</label>
                                        <input type="number" name="current_servers" value={inputs.current_servers} onChange={handleInputChange} class="w-full bg-slate-950 border border-slate-800 focus:border-brand-500 rounded-lg px-3 py-1.5 text-sm text-slate-100 outline-none" />
                                    </div>
                                    <div>
                                        <label class="block text-xs font-medium text-slate-400 mb-1">Response Time (ms)</label>
                                        <input type="number" name="response_time" value={inputs.response_time} onChange={handleInputChange} class="w-full bg-slate-950 border border-slate-800 focus:border-brand-500 rounded-lg px-3 py-1.5 text-sm text-slate-100 outline-none" />
                                    </div>
                                    <div>
                                        <label class="block text-xs font-medium text-slate-400 mb-1">Error Rate (%)</label>
                                        <input type="number" step="0.01" name="error_rate" value={inputs.error_rate} onChange={handleInputChange} class="w-full bg-slate-950 border border-slate-800 focus:border-brand-500 rounded-lg px-3 py-1.5 text-sm text-slate-100 outline-none" />
                                    </div>
                                    <div class="flex items-end">
                                        <button type="submit" disabled={loading} class="w-full bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg text-sm px-4 py-2 transition flex items-center justify-center gap-2">
                                            {loading ? <span class="h-4 w-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></span> : <i data-lucide="refresh-cw" class="w-4 h-4"></i>}
                                            Analyze Slices
                                        </button>
                                    </div>
                                </form>
                            </div>
                            
                            {/* Running Decision Metrics */}
                            <div class="border border-slate-900 bg-slate-900/20 rounded-xl p-5 space-y-4 flex flex-col justify-between">
                                <div>
                                    <div class="flex items-center gap-2 border-b border-slate-900 pb-3">
                                        <i data-lucide="activity" class="w-4 h-4 text-emerald-500"></i>
                                        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Scale Orchestrator</h2>
                                    </div>
                                    <div class="mt-4 space-y-2">
                                        <div class="flex justify-between items-center text-xs">
                                            <span class="text-slate-400">Scaling Action:</span>
                                            <span class={`px-2.5 py-1 rounded text-xs font-bold ${
                                                prediction?.action === 'SCALE_UP' ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' :
                                                prediction?.action === 'SCALE_DOWN' ? 'bg-indigo-500/10 text-indigo-400 border border-indigo-500/20' :
                                                'bg-slate-800 text-slate-400'
                                            }`}>
                                                {prediction?.action || 'NO_ACTION'}
                                            </span>
                                        </div>
                                        <div class="flex justify-between items-center text-xs">
                                            <span class="text-slate-400">SLA Status:</span>
                                            <span class={`px-2.5 py-0.5 rounded text-xs font-medium ${
                                                prediction?.sla_status === 'VIOLATED' ? 'bg-rose-500/10 text-rose-400' :
                                                prediction?.sla_status === 'AT_RISK' ? 'bg-amber-500/10 text-amber-400' :
                                                'bg-emerald-500/10 text-emerald-400'
                                            }`}>
                                                {prediction?.sla_status || 'HEALTHY'}
                                            </span>
                                        </div>
                                        <div class="flex justify-between items-center text-xs">
                                            <span class="text-slate-400">Cooldown Lock:</span>
                                            <span class={`font-mono font-medium ${prediction?.cooldown_active ? 'text-amber-500' : 'text-slate-400'}`}>
                                                {prediction?.cooldown_active ? 'Locked (Cooldown Active)' : 'Active (Ready)'}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <div class="text-[10px] text-slate-500 font-mono pt-3 border-t border-slate-900">
                                    Trigger reasons: {prediction?.reason || 'System capacity stable.'}
                                </div>
                            </div>
                        </div>

                        {/* Error Notification Alert */}
                        {error && (
                            <div class="flex items-center gap-3 p-4 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-xl">
                                <i data-lucide="alert-triangle" class="w-5 h-5 flex-shrink-0"></i>
                                <div class="text-sm font-medium">Evaluation Error: {error}</div>
                            </div>
                        )}

                        {/* Metric Overview Widgets Cards */}
                        <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4">
                            <div class="border border-slate-900 bg-slate-900/10 p-4 rounded-xl space-y-2">
                                <div class="text-xs text-slate-400">CPU Usage</div>
                                <div class="text-2xl font-bold font-mono text-brand-500">{inputs.cpu_usage}%</div>
                            </div>
                            <div class="border border-slate-900 bg-slate-900/10 p-4 rounded-xl space-y-2">
                                <div class="text-xs text-slate-400">Memory Usage</div>
                                <div class="text-2xl font-bold font-mono text-purple-400">{inputs.memory_usage}%</div>
                            </div>
                            <div class="border border-slate-900 bg-slate-900/10 p-4 rounded-xl space-y-2">
                                <div class="text-xs text-slate-400">Active Sessions</div>
                                <div class="text-2xl font-bold font-mono text-emerald-400">{inputs.active_users}</div>
                            </div>
                            <div class="border border-slate-900 bg-slate-900/10 p-4 rounded-xl space-y-2">
                                <div class="text-xs text-slate-400">Capacity (Current / Target)</div>
                                <div class="text-2xl font-bold font-mono text-slate-200">
                                    {inputs.current_servers} <span class="text-xs text-slate-500">/ {prediction?.recommended_servers || inputs.current_servers}</span>
                                </div>
                            </div>
                            <div class="border border-slate-900 bg-slate-900/10 p-4 rounded-xl space-y-2">
                                <div class="text-xs text-slate-400">Hourly Costs</div>
                                <div class="text-2xl font-bold font-mono text-pink-400">${prediction?.hourly_cost || '0.00'}/hr</div>
                            </div>
                            <div class="border border-slate-900 bg-slate-900/10 p-4 rounded-xl space-y-2">
                                <div class="text-xs text-slate-400">Projected Daily Savings</div>
                                <div class="text-2xl font-bold font-mono text-emerald-400">${prediction?.estimated_savings || '0.00'}</div>
                            </div>
                        </div>

                        {/* Explainability & Anomaly Panels */}
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            
                            {/* SHAP XAI Explainability Panel */}
                            <div class="border border-slate-900 bg-slate-900/20 rounded-xl p-5 space-y-4">
                                <div class="flex items-center gap-2 border-b border-slate-900 pb-3">
                                    <i data-lucide="eye" class="w-4 h-4 text-brand-500"></i>
                                    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Explainable AI (SHAP Contributions)</h2>
                                </div>
                                <p class="text-xs text-slate-300 italic border-l-2 border-brand-500 pl-3">
                                    "{prediction?.shap_explanation || 'No active predictions evaluated.'}"
                                </p>
                                <div class="space-y-2.5 pt-2">
                                    {prediction?.shap_contributions && typeof prediction.shap_contributions === 'object' && Object.entries(prediction.shap_contributions).map(([cat, val]) => (
                                        <div key={cat} class="space-y-1">
                                            <div class="flex justify-between text-xs font-medium">
                                                <span class="text-slate-400">{cat}</span>
                                                <span class={typeof val === 'number' && val >= 0 ? 'text-rose-400' : 'text-emerald-400'}>
                                                    {typeof val === 'number' ? (val >= 0 ? '+' : '') + val.toFixed(4) : '0.0000'}
                                                </span>
                                            </div>
                                            <div class="w-full bg-slate-950 h-2 rounded-full overflow-hidden flex">
                                                {typeof val === 'number' && val >= 0 ? (
                                                    <>
                                                        <div class="w-1/2 bg-slate-950"></div>
                                                        <div class="bg-rose-500 h-2 rounded-r-full" style={{ width: `${Math.min(50, val * 50)}%` }}></div>
                                                    </>
                                                ) : (
                                                    <>
                                                        <div class="w-1/2 flex justify-end">
                                                            <div class="bg-emerald-500 h-2 rounded-l-full" style={{ width: `${Math.min(50, Math.abs(typeof val === 'number' ? val : 0.0) * 50)}%` }}></div>
                                                        </div>
                                                        <div class="w-1/2 bg-slate-950"></div>
                                                    </>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            {/* Anomaly Detection Panel */}
                            <div class="border border-slate-900 bg-slate-900/20 rounded-xl p-5 space-y-4">
                                <div class="flex items-center justify-between border-b border-slate-900 pb-3">
                                    <div class="flex items-center gap-2">
                                        <i data-lucide="shield-alert" class="w-4 h-4 text-purple-500"></i>
                                        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">AI Anomaly Status</h2>
                                    </div>
                                    {prediction && (
                                        <span class={`px-2 py-0.5 rounded text-xs font-semibold ${prediction.is_anomaly ? 'bg-rose-500/10 text-rose-400' : 'bg-emerald-500/10 text-emerald-400'}`}>
                                            {prediction.is_anomaly ? 'ANOMALY DETECTED' : 'NORMAL BEHAVIOR'}
                                        </span>
                                    )}
                                </div>
                                {prediction && (
                                    <div class="space-y-4">
                                        <div class="grid grid-cols-2 gap-4">
                                            <div class="bg-slate-950/50 p-3 rounded-lg border border-slate-900">
                                                <div class="text-xs text-slate-500">Severity</div>
                                                <div class={`text-sm font-bold mt-1 ${getSeverityColor(prediction.severity)} inline-block px-2 py-0.5 rounded border`}>
                                                    {prediction.severity}
                                                </div>
                                            </div>
                                            <div class="bg-slate-950/50 p-3 rounded-lg border border-slate-900">
                                                <div class="text-xs text-slate-500">Anomaly Probability Score</div>
                                                <div class="text-sm font-bold text-slate-300 mt-1">
                                                    {(prediction.anomaly_score * 100).toFixed(1)}%
                                                </div>
                                            </div>
                                        </div>
                                        <div class="space-y-1">
                                            <div class="text-xs text-slate-500">Affected Metrics</div>
                                            <div class="flex flex-wrap gap-1.5 mt-1">
                                                {prediction.affected_metrics.length > 0 ? (
                                                    prediction.affected_metrics.map(col => (
                                                        <span key={col} class="px-2 py-0.5 bg-rose-500/10 text-rose-400 border border-rose-500/20 text-xs font-semibold rounded">
                                                            {col}
                                                        </span>
                                                    ))
                                                ) : (
                                                    <span class="text-xs text-slate-400 italic">No metrics showing anomalies</span>
                                                )}
                                            </div>
                                        </div>
                                        <div class="space-y-1">
                                            <div class="text-xs text-slate-500">Action Recommendation</div>
                                            <p class="text-xs text-slate-300">
                                                {prediction.recommendation}
                                            </p>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Interactive Charts Timelines Grid */}
                        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
                            <div class="border border-slate-900 bg-slate-900/10 rounded-xl p-5 h-72">
                                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">CPU Utilization Timeline</h3>
                                <div ref={chartsRefs.cpu} class="h-60"></div>
                            </div>
                            <div class="border border-slate-900 bg-slate-900/10 rounded-xl p-5 h-72">
                                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Memory Utilization Timeline</h3>
                                <div ref={chartsRefs.memory} class="h-60"></div>
                            </div>
                            <div class="border border-slate-900 bg-slate-900/10 rounded-xl p-5 h-72">
                                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Active Users Timeline</h3>
                                <div ref={chartsRefs.users} class="h-60"></div>
                            </div>
                            <div class="border border-slate-900 bg-slate-900/10 rounded-xl p-5 h-72">
                                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Capacity: Current vs predicted vs Recommended</h3>
                                <div ref={chartsRefs.capacity} class="h-60"></div>
                            </div>
                            <div class="border border-slate-900 bg-slate-900/10 rounded-xl p-5 h-72">
                                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Response Time vs SLA Threshold</h3>
                                <div ref={chartsRefs.response} class="h-60"></div>
                            </div>
                            <div class="border border-slate-900 bg-slate-900/10 rounded-xl p-5 h-72">
                                <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Hosting Costs Timeline</h3>
                                <div ref={chartsRefs.cost} class="h-60"></div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        }

        // Render React components to DOM root
        const rootElement = document.getElementById("root");
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
