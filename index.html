<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Resource Optimization Console</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0c4a6e'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel Standalone to compile JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    
    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ═══════════════════════════════════════════════════════
           DESIGN TOKENS — light mode (:root) & dark mode (.dark)
           ═══════════════════════════════════════════════════════ */
        :root {
            --bg-base:            #f1f5f9;   /* page background  */
            --bg-surface:         #ffffff;   /* card surface     */
            --bg-surface-2:       #f8fafc;   /* nested card      */
            --bg-surface-3:       #f1f5f9;   /* elevated panel   */
            --bg-input:           #ffffff;
            --border:             #e2e8f0;
            --border-strong:      #cbd5e1;
            --text-primary:       #0f172a;
            --text-secondary:     #475569;
            --text-muted:         #94a3b8;
            --accent:             #0ea5e9;
            --scrollbar-track:    #f1f5f9;
            --scrollbar-thumb:    #cbd5e1;
            --scrollbar-hover:    #94a3b8;
        }
        .dark {
            --bg-base:            #020617;
            --bg-surface:         rgba(15,23,42,0.5);
            --bg-surface-2:       rgba(15,23,42,0.4);
            --bg-surface-3:       rgba(15,23,42,0.6);
            --bg-input:           #020617;
            --border:             #1e293b;
            --border-strong:      #334155;
            --text-primary:       #f1f5f9;
            --text-secondary:     #94a3b8;
            --text-muted:         #64748b;
            --accent:             #0ea5e9;
            --scrollbar-track:    #020617;
            --scrollbar-thumb:    #334155;
            --scrollbar-hover:    #475569;
        }
        body { font-family: 'Inter', sans-serif; }

        /* Smooth theme switch — cheap CSS-only, <150 ms */
        *, *::before, *::after {
            transition: background-color 150ms ease,
                        border-color     120ms ease;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track  { background: var(--scrollbar-track); }
        ::-webkit-scrollbar-thumb  { background: var(--scrollbar-thumb); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

        /* Theme toggle pill button */
        .theme-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 11px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 150ms ease, border-color 120ms ease, color 120ms ease;
        }
        .theme-btn:hover  { background: var(--bg-surface-3); }
        .theme-btn:focus  { outline: 2px solid #0ea5e9; outline-offset: 2px; }
    </style>
</head>
<body class="h-full">
    <div id="error-console" style="color: #ef4444; background: #020617; font-family: monospace; padding: 20px; display: none; white-space: pre-wrap; z-index: 9999; position: absolute; top: 0; left: 0; width: 100%; box-sizing: border-box; border-bottom: 2px solid #ef4444;">
        <h3 style="margin-top: 0; display: flex; align-items: center; gap: 8px;">❌ Browser Execution Error Detected</h3>
        <div id="error-message"></div>
    </div>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            var consoleDiv = document.getElementById("error-console");
            var msgDiv = document.getElementById("error-message");
            if (consoleDiv && msgDiv) {
                consoleDiv.style.display = "block";
                msgDiv.textContent = message + "\n\nat " + source + ":" + lineno + ":" + colno + (error ? "\n\nStack:\n" + error.stack : "");
            }
            return false;
        };
    </script>
    <div id="root" class="h-full"></div>

    <!-- Anti-flash theme script (runs before React, prevents wrong-theme flash) -->
    <script>
        (function () {
            var saved = localStorage.getItem('cloudopt-theme');
            var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && sysDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <!-- React App Script -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Read initial theme preference (localStorage > system > light fallback)
        const getInitialDark = () => {
            const saved = localStorage.getItem('cloudopt-theme');
            if (saved) return saved === 'dark';
            return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        };

        const FALLBACK_RATES = {
            USD: 1.0,
            INR: 84.30,
            EUR: 0.92,
            GBP: 0.78,
            JPY: 154.50,
            AUD: 1.52,
            CAD: 1.39,
            SGD: 1.34
        };

        const getInitialCurrency = () => {
            const saved = localStorage.getItem('cloudopt-currency');
            return saved || 'INR';
        };

        // API Endpoint configurations
        const API_URL = window.location.origin && window.location.origin !== "null" && !window.location.origin.startsWith("file://") 
            ? window.location.origin 
            : "http://127.0.0.1:8000";

        function App() {
            // Loading and connection state variables
            const [connected, setConnected] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            
            // Current input values form state
            const [inputs, setInputs] = useState({
                cpu_usage: 45.0,
                memory_usage: 50.0,
                network_traffic: 120.0,
                active_users: 180,
                current_servers: 5,
                server_cost: 0.60,
                response_time: 120.0,
                error_rate: 0.0,
                safety_margin: 0.10,
                min_servers: 1,
                max_servers: 20
            });
            
            // Latest prediction response state
            const [prediction, setPrediction] = useState(null);
            
            // Historical timeline telemetry dataset state (for charts)
            const [history, setHistory] = useState([]);

            // Multi-Objective Optimizer states
            const [activeTab, setActiveTab] = useState('overview'); // 'overview', 'optimize', 'predict', 'what-if', 'explain'
            const [optWeights, setOptWeights] = useState({
                cost: 1.0,
                latency: 1.0,
                sla: 1.0,
                carbon: 1.0,
                energy: 0.5,
                overprovisioning: 0.5,
                underprovisioning: 0.8,
                stability: 0.3
            });
            const [optResult, setOptResult] = useState(null);
            const [optLoading, setOptLoading] = useState(false);

            // Kubernetes autoscaling status state
            const [k8sStatus, setK8sStatus] = useState(null);

            // MLOps self-monitoring & retraining states
            const [mlopsStatus, setMlopsStatus] = useState(null);
            const [mlopsMetrics, setMlopsMetrics] = useState(null);
            const [mlopsDrift, setMlopsDrift] = useState(null);
            const [mlopsLoading, setMlopsLoading] = useState(false);
            const [mlopsRetrainResult, setMlopsRetrainResult] = useState(null);

            // AIOps & Incident Management states
            const [aiopsGraph, setAiopsGraph] = useState(null);
            const [aiopsIncidents, setAiopsIncidents] = useState([]);
            const [aiopsExperiments, setAiopsExperiments] = useState(null);
            const [aiopsLoading, setAiopsLoading] = useState(false);
            const [selectedFault, setSelectedFault] = useState('CPU_SATURATION');

            // Safety & Policy states
            const [safetyPolicies, setSafetyPolicies] = useState(null);
            const [safetyRisk, setSafetyRisk] = useState(null);
            const [safetyAuditLogs, setSafetyAuditLogs] = useState([]);
            const [safetyLoading, setSafetyLoading] = useState(false);
            const [whatIfScenario, setWhatIfScenario] = useState({ traffic_increase_pct: 50 });
            const [whatIfResult, setWhatIfResult] = useState(null);

            // UI Toggle States for Technical Details
            const [showTechDetails, setShowTechDetails] = useState({
                overview: false,
                optimize: false,
                predict: false,
                whatif: false,
                explain: false
            });
            const toggleTechDetails = (section) => {
                setShowTechDetails(prev => ({
                    ...prev,
                    [section]: !prev[section]
                }));
            };

            // View Mode State
            const [isAdvanced, setIsAdvanced] = useState(() => {
                const saved = localStorage.getItem('cloudopt-view-mode');
                return saved === 'advanced';
            });

            const toggleViewMode = () => {
                const next = !isAdvanced;
                setIsAdvanced(next);
                localStorage.setItem('cloudopt-view-mode', next ? 'advanced' : 'simple');
                if (!next && ['predict', 'what-if', 'explain', 'monitoring', 'models', 'kubernetes', 'aiops', 'experiments', 'audit'].includes(activeTab)) {
                    setActiveTab('overview');
                }
            };

            // ── Theme management ────────────────────────────────────────────
            const [darkMode, setDarkMode] = useState(getInitialDark);

            // ── Currency management ─────────────────────────────────────────
            const [selectedCurrency, setSelectedCurrency] = useState(getInitialCurrency);
            const [exchangeRates, setExchangeRates] = useState(FALLBACK_RATES);
            const [exchangeRatesMeta, setExchangeRatesMeta] = useState({
                source: 'Local Fallback',
                timestamp: Math.floor(Date.now() / 1000),
                status: 'fallback'
            });
            const [exchangeError, setExchangeError] = useState(null);
            const [showCostDetails, setShowCostDetails] = useState(false);

            const toggleTheme = () => {
                const next = !darkMode;
                setDarkMode(next);
                document.documentElement.classList.toggle('dark', next);
                localStorage.setItem('cloudopt-theme', next ? 'dark' : 'light');
                // Re-render ApexCharts with updated theme colours
                setTimeout(() => renderChartsForTheme(next), 60);
            };

            // Respect OS-level preference changes if user hasn't picked manually
            useEffect(() => {
                const mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
                if (!mq) return;
                const handler = (e) => {
                    if (!localStorage.getItem('cloudopt-theme')) {
                        setDarkMode(e.matches);
                        document.documentElement.classList.toggle('dark', e.matches);
                        setTimeout(() => renderChartsForTheme(e.matches), 60);
                    }
                };
                mq.addEventListener('change', handler);
                return () => mq.removeEventListener('change', handler);
            }, []); // eslint-disable-line

            // Fetch live rates from gateway endpoint
            const fetchRates = async () => {
                try {
                    const res = await fetch(`${API_URL}/rates`);
                    if (res.ok) {
                        const data = await res.json();
                        setExchangeRates(data.rates);
                        setExchangeRatesMeta({
                            source: data.source,
                            timestamp: data.timestamp,
                            status: data.status
                        });
                        setExchangeError(null);
                    } else {
                        throw new Error("HTTP failure loading exchange rates");
                    }
                } catch (e) {
                    console.warn("Failed fetching live rates:", e);
                    setExchangeError("Currency conversion temporarily unavailable.");
                    setExchangeRatesMeta(prev => ({ ...prev, status: 'error' }));
                }
            };

            // Periodically load and update rates
            useEffect(() => {
                fetchRates();
                const interval = setInterval(fetchRates, 600000); // 10 minutes refresh
                return () => clearInterval(interval);
            }, []);

            const handleCurrencyChange = (curr) => {
                setSelectedCurrency(curr);
                localStorage.setItem('cloudopt-currency', curr);
                // Trigger charts update
                setTimeout(() => {
                    renderChartsForTheme(darkMode);
                    if (optResult) renderParetoChart();
                }, 50);
            };

            const getCurrencySymbol = (curr) => {
                const symbols = {
                    USD: '$', INR: '₹', EUR: '€', GBP: '£', JPY: '¥', AUD: 'A$', CAD: 'C$', SGD: 'S$'
                };
                return symbols[curr] || '$';
            };

            const formatCurrencyVal = (amountInUsd, targetCurr = selectedCurrency, isHourly = false) => {
                const rates = exchangeRates || FALLBACK_RATES;
                const rate = rates[targetCurr];

                // Error fallback: If rates missing, fall back to USD display
                if (!rate || rate <= 0 || exchangeRatesMeta.status === 'error') {
                    return new Intl.NumberFormat('en-US', {
                        style: 'currency',
                        currency: 'USD',
                        minimumFractionDigits: isHourly ? 4 : 2,
                        maximumFractionDigits: isHourly ? 4 : 2
                    }).format(amountInUsd) + ' USD';
                }

                let amount = amountInUsd * rate;
                if (amount < 0 && amount > -0.0001) {
                    amount = 0;
                }

                let locale = 'en-US';
                if (targetCurr === 'INR') locale = 'en-IN';
                else if (targetCurr === 'EUR') locale = 'de-DE';
                else if (targetCurr === 'GBP') locale = 'en-GB';
                else if (targetCurr === 'JPY') locale = 'ja-JP';
                else if (targetCurr === 'AUD') locale = 'en-AUD';
                else if (targetCurr === 'CAD') locale = 'en-CA';
                else if (targetCurr === 'SGD') locale = 'en-SG';

                let decimals = 2;
                if (targetCurr === 'JPY') {
                    decimals = isHourly ? 2 : 0;
                } else {
                    decimals = isHourly ? 4 : 2;
                }

                return new Intl.NumberFormat(locale, {
                    style: 'currency',
                    currency: targetCurr,
                    minimumFractionDigits: decimals,
                    maximumFractionDigits: decimals
                }).format(amount);
            };

            // Ref to track charts instances for destruction/re-draw
            const chartsRefs = {
                cpu: useRef(null),
                memory: useRef(null),
                users: useRef(null),
                capacity: useRef(null),
                response: useRef(null),
                cost: useRef(null),
                pareto: useRef(null)
            };
            const chartsInstances = useRef({});


            // 1. Initial health check and seed initial historical records
            useEffect(() => {
                checkHealth();
                // Initialize default history timeline
                const initialHistory = [];
                const now = new Date();
                for (let i = 19; i >= 0; i--) {
                    const time = new Date(now.getTime() - i * 5 * 60 * 1000);
                    initialHistory.push({
                        time: time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        cpu: 30 + Math.random() * 25,
                        memory: 40 + Math.random() * 20,
                        users: 100 + Math.floor(Math.random() * 80),
                        traffic: 80 + Math.random() * 50,
                        current_servers: 5,
                        predicted_servers: 5,
                        recommended_servers: 5,
                        cost: 3.0,
                        response_time: 90 + Math.random() * 30
                    });
                }
                setHistory(initialHistory);
                
                // Fetch first prediction
                triggerPrediction(inputs, initialHistory);
            }, []);

            // 2. Trigger ApexCharts updates whenever history or visibility changes
            useEffect(() => {
                if (history.length === 0) return;
                setTimeout(() => { renderCharts(); }, 100);
            }, [history, activeTab, showTechDetails.overview, showTechDetails.predict]);

            // 2b. Re-render charts when dark/light theme changes
            useEffect(() => {
                if (history.length === 0) return;
                setTimeout(() => { renderChartsForTheme(darkMode); }, 80);
            }, [darkMode]); // eslint-disable-line

            const checkHealth = async () => {
                try {
                    const res = await fetch(`${API_URL}/health`);
                    if (res.ok) {
                        setConnected(true);
                    } else {
                        setConnected(false);
                    }
                } catch (e) {
                    setConnected(false);
                }
            };

            const triggerPrediction = async (currentInputs, currentHistory = history) => {
                setLoading(true);
                setError(null);
                
                // Construct complete payload matching PredictRequest
                const payload = {
                    cpu_usage: parseFloat(currentInputs.cpu_usage),
                    memory_usage: parseFloat(currentInputs.memory_usage),
                    network_traffic: parseFloat(currentInputs.network_traffic),
                    active_users: parseInt(currentInputs.active_users),
                    current_servers: parseInt(currentInputs.current_servers),
                    server_cost: parseFloat(currentInputs.server_cost),
                    response_time: parseFloat(currentInputs.response_time),
                    error_rate: parseFloat(currentInputs.error_rate),
                    safety_margin: parseFloat(currentInputs.safety_margin),
                    min_servers: parseInt(currentInputs.min_servers),
                    max_servers: parseInt(currentInputs.max_servers)
                };

                try {
                    const res = await fetch(`${API_URL}/predict`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!res.ok) {
                        const errData = await res.json();
                        throw new Error(errData.detail || "API evaluation failed");
                    }
                    
                    const data = await res.json();
                    setPrediction(data);
                    setConnected(true);

                    // Update historical array sliding window
                    const now = new Date();
                    const nextHistory = [...currentHistory];
                    if (nextHistory.length >= 25) {
                        nextHistory.shift();
                    }
                    
                    nextHistory.push({
                        time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                        cpu: payload.cpu_usage,
                        memory: payload.memory_usage,
                        users: payload.active_users,
                        traffic: payload.network_traffic,
                        current_servers: payload.current_servers,
                        predicted_servers: data.predicted_servers || payload.current_servers,
                        recommended_servers: data.recommended_servers || payload.current_servers,
                        cost: data.hourly_cost || 0.0,
                        response_time: payload.response_time
                    });
                    setHistory(nextHistory);
                    
                    // Update input current_servers for the next tick
                    setInputs(prev => ({
                        ...prev,
                        current_servers: data.recommended_servers || prev.current_servers
                    }));

                } catch (e) {
                    loggerError(e.message);
                    setError(e.message);
                    setPrediction(null);
                } finally {
                    setLoading(false);
                }
            };

            const loggerError = (msg) => {
                console.error("Dashboard error:", msg);
            };

            // Preset simulation templates
            const runSimulation = (templateName) => {
                let simInputs = { ...inputs };
                const currentCapacity = inputs.current_servers;
                
                if (templateName === 'traffic_spike') {
                    // Suddenly multiply load parameters
                    simInputs.cpu_usage = 89.0;
                    simInputs.memory_usage = 78.0;
                    simInputs.active_users = 950;
                    simInputs.network_traffic = 1120.0;
                    simInputs.request_rate = 1450.0;
                    simInputs.response_time = 320.0;
                    simInputs.error_rate = 1.2;
                } else if (templateName === 'memory_leak') {
                    simInputs.cpu_usage = 45.0;
                    simInputs.memory_usage = 96.0;  // saturated memory
                    simInputs.active_users = 120;
                    simInputs.response_time = 140.0;
                } else if (templateName === 'healthy') {
                    simInputs.cpu_usage = 42.0;
                    simInputs.memory_usage = 48.0;
                    simInputs.active_users = 160;
                    simInputs.network_traffic = 110.0;
                    simInputs.response_time = 110.0;
                    simInputs.error_rate = 0.0;
                }
                
                setInputs(simInputs);
                triggerPrediction(simInputs);
            };

            const triggerOptimization = async (customWeights = optWeights) => {
                setOptLoading(true);
                setError(null);
                try {
                    const reqRate = parseFloat(inputs.request_rate || (inputs.active_users * 4.2));
                    const predReq = parseInt(prediction?.recommended_servers || inputs.current_servers);
                    const payload = {
                        workload: {
                            request_rate: reqRate,
                            active_users: parseInt(inputs.active_users),
                            predicted_required_servers: predReq
                        },
                        current_configuration: {
                            replicas: parseInt(inputs.current_servers),
                            instance_type: "m5.large",
                            cpu_alloc: 2.0,
                            mem_alloc: 8.0,
                            region: "us-east-1"
                        },
                        weights: customWeights,
                        constraints: {
                            min_replicas: parseInt(inputs.min_servers),
                            max_replicas: parseInt(inputs.max_servers),
                            target_latency: 200.0,
                            max_error_rate: 1.0
                        }
                    };
                    const res = await fetch(`${API_URL}/optimizer/optimize`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error(await res.text());
                    const data = await res.json();
                    setOptResult(data);
                } catch (e) {
                    console.error("Optimization failed:", e);
                    setError("Optimization failed: " + e.message);
                } finally {
                    setOptLoading(false);
                }
            };

            const renderParetoChart = () => {
                if (!optResult || !chartsRefs.pareto.current) return;
                
                const paretoFront = optResult.pareto_front || [];
                const recommended = optResult.recommended_configuration;
                const estCost = optResult.estimated_cost;
                const estLat = optResult.estimated_latency;
                
                const currencyRate = exchangeRates[selectedCurrency] || FALLBACK_RATES[selectedCurrency] || 1.0;
                const currencySymbol = getCurrencySymbol(selectedCurrency);
                
                const seriesData = paretoFront.map(c => [parseFloat((c.cost * currencyRate).toFixed(4)), parseFloat(c.latency.toFixed(1))]);
                const recData = [[parseFloat((estCost * currencyRate).toFixed(4)), parseFloat(estLat.toFixed(1))]];
                
                const _isDark  = document.documentElement.classList.contains('dark');
                const _cMode   = _isDark ? 'dark' : 'light';
                const _cGrid   = _isDark ? '#1e293b' : '#e2e8f0';
                const _cLabel  = _isDark ? '#94a3b8' : '#475569';
                const _cAxis   = _isDark ? '#64748b' : '#94a3b8';
                const options = {
                    chart: {
                        type: 'scatter',
                        height: 250,
                        toolbar: { show: false },
                        background: 'transparent'
                    },
                    theme: { mode: _cMode },
                    grid: { borderColor: _cGrid, strokeDashArray: 4 },
                    series: [
                        { name: 'Pareto Candidate', data: seriesData },
                        { name: 'Recommended Config', data: recData }
                    ],
                    colors: ['#0ea5e9', '#2ecc71'],
                    markers: {
                        size: [6, 10],
                        strokeWidth: 1,
                        fillOpacity: [0.6, 1.0],
                        shape: ["circle", "square"]
                    },
                    xaxis: {
                        title: { text: 'Hourly Cost ($)', style: { color: _cLabel } },
                        labels: { style: { colors: _cAxis }, formatter: (val) => '$' + parseFloat(val).toFixed(2) }
                    },
                    yaxis: {
                        title: { text: 'Latency (ms)', style: { color: _cLabel } },
                        labels: { style: { colors: _cAxis } }
                    },
                    tooltip: {
                        theme: _cMode,
                        custom: function({ series, seriesIndex, dataPointIndex, w }) {
                            if (seriesIndex === 1) {
                                return '<div class="p-3 bg-slate-900 border border-slate-800 text-xs rounded text-slate-100 shadow-lg">' +
                                    '<b class="text-emerald-400">Selected Optimal:</b><br/>' +
                                    recommended.replicas + 'x ' + recommended.instance_type + '<br/>' +
                                    'Cost: ' + formatCurrencyVal(estCost, selectedCurrency, true) + '/hr<br/>' +
                                    'Latency: ' + estLat.toFixed(1) + ' ms' +
                                    '</div>';
                            }
                            const p = paretoFront[dataPointIndex];
                            if (!p) return '';
                            return '<div class="p-3 bg-slate-900 border border-slate-800 text-xs rounded text-slate-100 shadow-lg">' +
                                '<b class="text-brand-400">' + p.replicas + 'x ' + p.instance_type + '</b> (' + p.region + ')<br/>' +
                                'CPU: ' + p.cpu_alloc + ' cores | Mem: ' + p.mem_alloc + ' GB<br/>' +
                                'Cost: ' + formatCurrencyVal(p.cost, selectedCurrency, true) + '/hr<br/>' +
                                'Latency: ' + p.latency.toFixed(1) + ' ms<br/>' +
                                'Carbon: ' + p.carbon.toFixed(1) + ' gCO2/hr' +
                                '</div>';
                        }
                    },
                    legend: { show: true, labels: { colors: _cLabel } }
                };
                
                if (chartsInstances.current.pareto) {
                    try {
                        chartsInstances.current.pareto.updateOptions(options);
                    } catch (err) {
                        try { chartsInstances.current.pareto.destroy(); } catch (d) {}
                        const chart = new ApexCharts(chartsRefs.pareto.current, options);
                        chart.render();
                        chartsInstances.current.pareto = chart;
                    }
                } else {
                    const chart = new ApexCharts(chartsRefs.pareto.current, options);
                    chart.render();
                    chartsInstances.current.pareto = chart;
                }
            };

            // Trigger Pareto plot on tab or result updates
            useEffect(() => {
                if ((activeTab === 'optimizer' || (activeTab === 'optimize' && showTechDetails.optimize)) && optResult) {
                    setTimeout(() => {
                        renderParetoChart();
                    }, 100);
                }
            }, [activeTab, optResult, showTechDetails.optimize]);

            const fetchK8sStatus = async () => {
                try {
                    const res = await fetch(`${API_URL}/k8s/status`);
                    if (res.ok) {
                        const data = await res.json();
                        setK8sStatus(data);
                    }
                } catch (e) {
                    console.warn("Failed to fetch k8s scaling status:", e);
                }
            };

            // Periodically poll Kubernetes scaling status
            useEffect(() => {
                fetchK8sStatus();
                const interval = setInterval(fetchK8sStatus, 10000);
                return () => clearInterval(interval);
            }, []);

            const fetchMlopsStatus = async () => {
                try {
                    setMlopsLoading(true);
                    const statusRes = await fetch(`${API_URL}/model/status`);
                    const metricsRes = await fetch(`${API_URL}/model/metrics`);
                    const driftRes = await fetch(`${API_URL}/model/drift`);
                    
                    if (statusRes.ok) setMlopsStatus(await statusRes.json());
                    if (metricsRes.ok) setMlopsMetrics(await metricsRes.json());
                    if (driftRes.ok) setMlopsDrift(await driftRes.json());
                } catch (e) {
                    console.warn("Failed to fetch MLOps stats:", e);
                } finally {
                    setMlopsLoading(false);
                }
            };

            const triggerMlopsRetrain = async (force = false) => {
                try {
                    setMlopsLoading(true);
                    setMlopsRetrainResult(null);
                    const res = await fetch(`${API_URL}/model/retrain`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ force: force, authorized: true })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setMlopsRetrainResult(data);
                        fetchMlopsStatus();
                    } else {
                        alert("Retraining failed: " + await res.text());
                    }
                } catch (e) {
                    console.error("Retraining error:", e);
                } finally {
                    setMlopsLoading(false);
                }
            };

            const triggerMlopsRollback = async () => {
                try {
                    if (!confirm("Are you sure you want to rollback to the previous stable version? This will swap the active model in memory.")) return;
                    setMlopsLoading(true);
                    const res = await fetch(`${API_URL}/model/rollback`, { method: 'POST' });
                    if (res.ok) {
                        const data = await res.json();
                        alert(data.reason || "Rollback completed!");
                        fetchMlopsStatus();
                    } else {
                        alert("Rollback failed: " + await res.text());
                    }
                } catch (e) {
                    console.error("Rollback error:", e);
                } finally {
                    setMlopsLoading(false);
                }
            };

            const fetchAiopsData = async () => {
                try {
                    setAiopsLoading(true);
                    const graphRes = await fetch(`${API_URL}/aiops/graph`);
                    const incidentsRes = await fetch(`${API_URL}/aiops/incidents`);
                    const expRes = await fetch(`${API_URL}/aiops/experiments`);
                    
                    if (graphRes.ok) setAiopsGraph(await graphRes.json());
                    if (incidentsRes.ok) setAiopsIncidents(await incidentsRes.json());
                    if (expRes.ok) setAiopsExperiments(await expRes.json());
                } catch (e) {
                    console.warn("Failed to fetch AIOps telemetry:", e);
                } finally {
                    setAiopsLoading(false);
                }
            };

            const injectFault = async () => {
                try {
                    setAiopsLoading(true);
                    const res = await fetch(`${API_URL}/aiops/fault_inject`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fault_type: selectedFault })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        alert(`Fault successfully injected!\nIncident: ${data.incident}\nRoot Cause: ${data.root_cause}`);
                        fetchAiopsData();
                    } else {
                        alert("Fault injection failed: " + await res.text());
                    }
                } catch (e) {
                    console.error("Fault injection error:", e);
                } finally {
                    setAiopsLoading(false);
                }
            };

            const resolveIncident = async (incidentId) => {
                try {
                    setAiopsLoading(true);
                    const res = await fetch(`${API_URL}/aiops/resolve`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ incident_id: incidentId })
                    });
                    if (res.ok) {
                        alert("Incident resolved. Service metrics restored to baseline.");
                        fetchAiopsData();
                    } else {
                        alert("Failed to resolve incident: " + await res.text());
                    }
                } catch (e) {
                    console.error("Resolution error:", e);
                } finally {
                    setAiopsLoading(false);
                }
            };

            const fetchSafetyData = async () => {
                try {
                    setSafetyLoading(true);
                    const policiesRes = await fetch(`${API_URL}/policies`);
                    const riskRes = await fetch(`${API_URL}/risk`);
                    const auditRes = await fetch(`${API_URL}/audit`);
                    
                    if (policiesRes.ok) setSafetyPolicies(await policiesRes.json());
                    if (riskRes.ok) setSafetyRisk(await riskRes.json());
                    if (auditRes.ok) setSafetyAuditLogs(await auditRes.json());
                } catch (e) {
                    console.warn("Failed to fetch safety state:", e);
                } finally {
                    setSafetyLoading(false);
                }
            };

            const triggerEmergencyHalt = async () => {
                try {
                    setSafetyLoading(true);
                    const res = await fetch(`${API_URL}/emergency-stop`, { method: 'POST' });
                    if (res.ok) {
                        alert("EMERGENCY STOP ENGAGED. Autonomous execution halted.");
                        fetchSafetyData();
                    }
                } catch (e) {
                    console.error("Emergency stop error:", e);
                } finally {
                    setSafetyLoading(false);
                }
            };

            const releaseEmergencyHalt = async () => {
                try {
                    setSafetyLoading(true);
                    const res = await fetch(`${API_URL}/emergency-start`, { method: 'POST' });
                    if (res.ok) {
                        alert("Emergency stop released. System operating mode restored.");
                        fetchSafetyData();
                    }
                } catch (e) {
                    console.error("Emergency release error:", e);
                } finally {
                    setSafetyLoading(false);
                }
            };

            const setMode = async (mode) => {
                try {
                    setSafetyLoading(true);
                    const res = await fetch(`${API_URL}/mode/set`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mode: mode })
                    });
                    if (res.ok) {
                        alert(`Operating mode changed to: ${mode}`);
                        fetchSafetyData();
                    } else {
                        alert("Mode shift blocked: " + await res.text());
                    }
                } catch (e) {
                    console.error("Mode set error:", e);
                } finally {
                    setSafetyLoading(false);
                }
            };

            const runWhatIf = async () => {
                try {
                    setSafetyLoading(true);
                    const res = await fetch(`${API_URL}/decision/simulate`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            traffic_increase_pct: parseFloat(whatIfScenario.traffic_increase_pct),
                            current_replicas: parseInt(inputs.current_servers) || 4
                        })
                    });
                    if (res.ok) {
                        setWhatIfResult(await res.json());
                    }
                } catch (e) {
                    console.error("What-if execution error:", e);
                } finally {
                    setSafetyLoading(false);
                }
            };

            const updateSafetyPolicies = async (policiesObj) => {
                try {
                    setSafetyLoading(true);
                    const res = await fetch(`${API_URL}/policies/update`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(policiesObj)
                    });
                    if (res.ok) {
                        alert("Safety Policies updated successfully!");
                        fetchSafetyData();
                    } else {
                        alert("Policy update failed: " + await res.text());
                    }
                } catch (e) {
                    console.error("Policy update error:", e);
                } finally {
                    setSafetyLoading(false);
                }
            };

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setInputs(prev => ({
                    ...prev,
                    [name]: value
                }));
            };

            // renderChartsForTheme — called on mount/history changes and on theme switch
            const renderChartsForTheme = (isDark) => {
                const times = history.map(h => h.time);
                const cMode   = isDark ? 'dark' : 'light';
                const cGrid   = isDark ? '#1e293b' : '#e2e8f0';
                const cLabel  = isDark ? '#64748b' : '#94a3b8';
                const cLegend = isDark ? '#94a3b8' : '#475569';

                const currencyRate = exchangeRates[selectedCurrency] || FALLBACK_RATES[selectedCurrency] || 1.0;
                const currencySymbol = getCurrencySymbol(selectedCurrency);

                // Chart Options template
                const baseOptions = {
                    chart: {
                        type: 'line',
                        height: '100%',
                        toolbar: { show: false },
                        animations: { enabled: true, easing: 'easeinout', speed: 400 },
                        background: 'transparent'
                    },
                    theme: { mode: cMode },
                    stroke: { curve: 'smooth', width: 2 },
                    grid: { borderColor: cGrid, strokeDashArray: 4 },
                    xaxis: { categories: times, labels: { style: { colors: cLabel } } },
                    yaxis: { labels: { style: { colors: cLabel } } },
                    tooltip: { theme: cMode },
                    legend: { show: true, position: 'top', horizontalAlign: 'right', labels: { colors: cLegend } }
                };

                const updateOrCreate = (key, element, options) => {
                    if (!element) return;
                    if (chartsInstances.current[key]) {
                        try {
                            chartsInstances.current[key].updateOptions(options);
                        } catch (err) {
                            console.warn("Chart update failed, recreating:", key, err);
                            try {
                                chartsInstances.current[key].destroy();
                            } catch (dErr) {}
                            const chart = new ApexCharts(element, options);
                            chart.render();
                            chartsInstances.current[key] = chart;
                        }
                    } else {
                        const chart = new ApexCharts(element, options);
                        chart.render();
                        chartsInstances.current[key] = chart;
                    }
                };

                // 1. CPU Chart
                updateOrCreate('cpu', chartsRefs.cpu.current, {
                    ...baseOptions,
                    series: [{ name: 'CPU Usage (%)', data: history.map(h => h.cpu) }],
                    colors: ['#0ea5e9'],
                    yaxis: { min: 0, max: 100, labels: { style: { colors: '#64748b' } } }
                });

                // 2. Memory Chart
                updateOrCreate('memory', chartsRefs.memory.current, {
                    ...baseOptions,
                    series: [{ name: 'Memory Usage (%)', data: history.map(h => h.memory) }],
                    colors: ['#a855f7'],
                    yaxis: { min: 0, max: 100, labels: { style: { colors: '#64748b' } } }
                });

                // 3. Active Users Chart
                updateOrCreate('users', chartsRefs.users.current, {
                    ...baseOptions,
                    series: [{ name: 'Active Sessions', data: history.map(h => h.users) }],
                    colors: ['#10b981']
                });

                // 4. Capacity Chart (Current vs Predicted vs Recommended)
                updateOrCreate('capacity', chartsRefs.capacity.current, {
                    ...baseOptions,
                    series: [
                        { name: 'Current Servers', data: history.map(h => h.current_servers) },
                        { name: 'Predicted Sizing', data: history.map(h => h.predicted_servers) },
                        { name: 'Recommended Sizing', data: history.map(h => h.recommended_servers) }
                    ],
                    colors: ['#64748b', '#0ea5e9', '#10b981'],
                    stroke: { curve: 'stepline', width: 2 }
                });

                // 5. Response Latency vs SLA
                updateOrCreate('response', chartsRefs.response.current, {
                    ...baseOptions,
                    series: [
                        { name: 'Response Time (ms)', data: history.map(h => h.response_time) },
                        { name: 'SLA Limit (ms)', data: history.map(h => 200) }
                    ],
                    colors: ['#f59e0b', '#ef4444'],
                    stroke: { curve: 'smooth', width: [2, 1.5], dashArray: [0, 4] }
                });

                // 6. Cost Sizing Slices
                updateOrCreate('cost', chartsRefs.cost.current, {
                    ...baseOptions,
                    series: [{ name: `Hourly Cost (${currencySymbol})`, data: history.map(h => h.cost * currencyRate) }],
                    colors: ['#ec4899'],
                    yaxis: {
                        title: { text: `Cost (${currencySymbol})`, style: { color: cLegend } },
                        labels: {
                            style: { colors: cLabel },
                            formatter: (val) => currencySymbol + parseFloat(val).toFixed(selectedCurrency === 'JPY' ? 0 : 2)
                        }
                    }
                });
            };

            // Convenience wrapper — reads current DOM class to pick theme
            const renderCharts = () =>
                renderChartsForTheme(document.documentElement.classList.contains('dark'));

            const getSeverityColor = (sev) => {
                switch(sev) {
                    case 'CRITICAL': return 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                    case 'HIGH': return 'bg-orange-500/10 text-orange-400 border-orange-500/20';
                    case 'MEDIUM': return 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                    default: return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                }
            };

            return (
                <div className="flex flex-col h-full bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
                    
                    {/* Header */}
                    <header className="flex flex-col sm:flex-row items-start sm:items-center justify-between px-6 py-4 border-b border-slate-200 dark:border-slate-900 bg-white/95 dark:bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
                        <div className="flex items-center gap-3">
                            <div className="p-2 bg-brand-500/10 text-brand-500 rounded-lg">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-6 h-6"><path d="M17.5 19A3.5 3.5 0 0 0 21 15.5c0-2.79-2.54-4.5-5-4.5-.42-1.89-1.76-3.5-3.5-3.5a4 4 0 0 0-4 4c0 .26.03.52.08.77A4.75 4.75 0 0 0 4 17a3 3 0 0 0 3 3h10.5Z"/></svg>
                            </div>
                            <div>
                                <h1 className="text-lg font-semibold tracking-tight text-slate-900 dark:text-slate-100">Cloud Health + Optimization Assistant</h1>
                                <p className="text-xs text-slate-500 dark:text-slate-400">Automated Cloud Management & Safeties</p>
                            </div>
                        </div>
                        
                        <div className="flex flex-wrap items-center gap-4 mt-3 sm:mt-0">
                            {/* Connection Indicator */}
                            {/* Currency Selector */}
                            <div className="flex items-center gap-1.5">
                                <span className="text-xs font-semibold text-slate-500 dark:text-slate-400">Currency:</span>
                                <select 
                                    value={selectedCurrency}
                                    onChange={(e) => handleCurrencyChange(e.target.value)}
                                    className="bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-xs text-slate-600 dark:text-slate-300 rounded px-2.5 py-1.5 outline-none focus:ring-1 focus:ring-brand-500"
                                >
                                    <option value="INR">🇮🇳 INR (₹)</option>
                                    <option value="USD">🇺🇸 USD ($)</option>
                                    <option value="EUR">🇪🇺 EUR (€)</option>
                                    <option value="GBP">🇬🇧 GBP (£)</option>
                                    <option value="JPY">🇯🇵 JPY (¥)</option>
                                    <option value="AUD">🇦🇺 AUD (A$)</option>
                                    <option value="CAD">🇨🇦 CAD (C$)</option>
                                    <option value="SGD">🇸🇬 SGD (S$)</option>
                                </select>
                            </div>

                            <div className="flex items-center gap-2 px-3 py-1.5 rounded-full border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-900">
                                <span className={`h-2.5 w-2.5 rounded-full ${connected ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'}`}></span>
                                <span className="text-xs font-medium text-slate-600 dark:text-slate-300">
                                    {connected ? 'System Connected' : 'Offline / Re-connecting'}
                                </span>
                            </div>
                            <button
                                onClick={toggleViewMode}
                                className="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 text-xs font-semibold transition"
                                title={isAdvanced ? 'Switch to Simple View (hides advanced panels)' : 'Switch to Advanced View (shows advanced panels)'}
                            >
                                {isAdvanced ? '⚙️ Advanced View' : '👤 Simple View'}
                            </button>
                            <button
                                onClick={toggleTheme}
                                className="theme-btn"
                                aria-label={darkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'}
                                title={darkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'}
                            >
                                {darkMode ? '☀ Light' : '🌙 Dark'}
                            </button>
                            <div className="text-xs text-slate-400 dark:text-slate-500 font-mono">v11.0.0</div>
                        </div>
                    </header>

                    {/* Main Container Layout */}
                    <div className="flex-1 overflow-y-auto px-6 py-6 space-y-6">
                        
                        {/* Tab Switcher */}
                        <div className="flex flex-wrap items-center justify-between border-b border-slate-200 dark:border-slate-900 pb-3 gap-2">
                            <div className="flex flex-wrap gap-2">
                                <button onClick={() => setActiveTab('overview')} className={`px-4 py-2 text-sm font-semibold rounded-lg transition-colors duration-200 ${activeTab === 'overview' ? 'bg-brand-600 text-white shadow' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900/30'}`}>
                                    Overview
                                </button>
                                <button onClick={() => { setActiveTab('optimize'); triggerOptimization(); }} className={`px-4 py-2 text-sm font-semibold rounded-lg transition-colors duration-200 ${activeTab === 'optimize' ? 'bg-brand-600 text-white shadow' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900/30'}`}>
                                    Optimize
                                </button>
                                {isAdvanced && (
                                    <>
                                        <button onClick={() => { setActiveTab('predict'); triggerPrediction(inputs); }} className={`px-4 py-2 text-sm font-semibold rounded-lg transition-colors duration-200 ${activeTab === 'predict' ? 'bg-brand-600 text-white shadow' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900/30'}`}>
                                            Predict
                                        </button>
                                        <button onClick={() => { setActiveTab('what-if'); runWhatIf(); }} className={`px-4 py-2 text-sm font-semibold rounded-lg transition-colors duration-200 ${activeTab === 'what-if' ? 'bg-brand-600 text-white shadow' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900/30'}`}>
                                            What-If
                                        </button>
                                        <button onClick={() => { setActiveTab('explain'); fetchSafetyData(); }} className={`px-4 py-2 text-sm font-semibold rounded-lg transition-colors duration-200 ${activeTab === 'explain' ? 'bg-brand-600 text-white shadow' : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900/30'}`}>
                                            Explain
                                        </button>
                                    </>
                                )}
                            </div>
                            
                            {/* More Actions Dropdown */}
                            {isAdvanced && (
                                <div className="relative group">
                                    <button className="px-4 py-2 text-sm font-semibold rounded-lg bg-slate-100 dark:bg-slate-900 hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-800 flex items-center gap-1.5 transition-colors">
                                        More
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" className="w-4 h-4"><path fillRule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" clipRule="evenodd" /></svg>
                                    </button>
                                    <div className="absolute right-0 top-full mt-1.5 w-48 bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-900 rounded-lg shadow-xl py-1.5 hidden group-hover:block hover:block z-[100] transition-all">
                                        <button onClick={() => { setActiveTab('monitoring'); setTimeout(() => renderCharts(), 100); }} className="w-full text-left px-4 py-2 text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900/50">
                                            Monitoring
                                        </button>
                                        <button onClick={() => { setActiveTab('models'); fetchMlopsStatus(); }} className="w-full text-left px-4 py-2 text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900/50">
                                            Models & Retraining
                                        </button>
                                        <button onClick={() => { setActiveTab('kubernetes'); fetchSafetyData(); }} className="w-full text-left px-4 py-2 text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900/50">
                                            Kubernetes & KEDA
                                        </button>
                                        <button onClick={() => { setActiveTab('aiops'); fetchAiopsData(); }} className="w-full text-left px-4 py-2 text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900/50">
                                            Incident Center & AIOps
                                        </button>
                                        <button onClick={() => { setActiveTab('experiments'); }} className="w-full text-left px-4 py-2 text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900/50">
                                            Chaos Experiments
                                        </button>
                                        <button onClick={() => { setActiveTab('audit'); fetchSafetyData(); }} className="w-full text-left px-4 py-2 text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-900/50">
                                            Safety Audit Logs
                                        </button>
                                    </div>
                                </div>
                            )}
