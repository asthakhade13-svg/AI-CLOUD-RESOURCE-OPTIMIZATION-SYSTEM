                                                ENGAGE HALT
                                            </button>
                                            <button onClick={() => releaseEmergencyHalt()} className="bg-slate-900 hover:bg-slate-800 text-slate-300 text-xs font-semibold py-1.5 px-3 rounded transition border border-slate-800">
                                                RELEASE STOP
                                            </button>
                                        </div>
                                    </div>

                                    <div className="border border-slate-900 bg-slate-900/20 p-5 rounded-xl space-y-2">
                                        <h3 className="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Active Risk score</h3>
                                        <div className="flex items-baseline justify-between">
                                            <span className={`text-2xl font-black font-mono ${safetyRisk?.status === 'CRITICAL' || safetyRisk?.status === 'HIGH' ? 'text-rose-400' : 'text-emerald-400'}`}>
                                                {safetyRisk?.status || 'LOW'}
                                            </span>
                                            <span className="text-xs text-slate-500 font-mono">Score: {safetyRisk?.score ? safetyRisk.score.toFixed(2) : '0.00'}/1.0</span>
                                        </div>
                                        <div className="text-[10px] text-slate-400 font-mono grid grid-cols-2 gap-x-2 gap-y-0.5 pt-1.5 border-t border-slate-900">
                                            <div>SLA Risk: {safetyRisk?.metrics.sla_risk_pct}%</div>
                                            <div>Uncertainty: {safetyRisk?.metrics.prediction_uncertainty.toFixed(2)}</div>
                                        </div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    {/* Policy Config Form */}
                                    <div className="lg:col-span-1 border border-slate-900 bg-slate-900/20 rounded-xl p-5 space-y-4">
                                        <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-900 pb-3 flex items-center gap-1.5">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 text-emerald-500"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                                            Enforced Policy Guardrails
                                        </h3>
                                        
                                        {safetyPolicies && (
                                            <form onSubmit={(e) => {
                                                e.preventDefault();
                                                const form = e.target;
                                                updateSafetyPolicies({
                                                    min_replicas: parseInt(form.min_replicas.value),
                                                    max_replicas: parseInt(form.max_replicas.value),
                                                    scaling_step_limit: parseInt(form.scaling_step_limit.value),
                                                    cooldown_seconds: parseInt(form.cooldown_seconds.value),
                                                    budget_limit_hourly: parseFloat(form.budget_limit_hourly.value),
                                                    sla_latency_threshold_ms: parseFloat(form.sla_latency_threshold_ms.value),
                                                    emergency_restrictions: form.emergency_restrictions.checked
                                                });
                                            }} className="space-y-3.5 text-xs">
                                                <div className="flex justify-between items-center">
                                                    <label className="text-slate-400">Min Replicas</label>
                                                    <input name="min_replicas" type="number" defaultValue={safetyPolicies.min_replicas} className="bg-slate-950 border border-slate-800 rounded px-2 py-1 w-20 text-right text-slate-200 font-mono" />
                                                </div>
                                                <div className="flex justify-between items-center">
                                                    <label className="text-slate-400">Max Replicas</label>
                                                    <input name="max_replicas" type="number" defaultValue={safetyPolicies.max_replicas} className="bg-slate-950 border border-slate-800 rounded px-2 py-1 w-20 text-right text-slate-200 font-mono" />
                                                </div>
                                                <div className="flex justify-between items-center">
                                                    <label className="text-slate-400">Max Scaling Step</label>
                                                    <input name="scaling_step_limit" type="number" defaultValue={safetyPolicies.scaling_step_limit} className="bg-slate-950 border border-slate-800 rounded px-2 py-1 w-20 text-right text-slate-200 font-mono" />
                                                </div>
                                                <div className="flex justify-between items-center">
                                                    <label className="text-slate-400">Cooldown Window (s)</label>
                                                    <input name="cooldown_seconds" type="number" defaultValue={safetyPolicies.cooldown_seconds} className="bg-slate-950 border border-slate-800 rounded px-2 py-1 w-20 text-right text-slate-200 font-mono" />
                                                </div>
                                                <div className="flex justify-between items-center">
                                                    <label className="text-slate-400">Budget Limit ($/hr)</label>
                                                    <input name="budget_limit_hourly" type="number" step="0.1" defaultValue={safetyPolicies.budget_limit_hourly} className="bg-slate-950 border border-slate-800 rounded px-2 py-1 w-20 text-right text-slate-200 font-mono" />
                                                </div>
                                                <div className="flex justify-between items-center">
                                                    <label className="text-slate-400">SLA Latency Target (ms)</label>
                                                    <input name="sla_latency_threshold_ms" type="number" defaultValue={safetyPolicies.sla_latency_threshold_ms} className="bg-slate-950 border border-slate-800 rounded px-2 py-1 w-20 text-right text-slate-200 font-mono" />
                                                </div>
                                                <div className="flex justify-between items-center pt-2 border-t border-slate-900/60">
                                                    <label className="text-slate-400">Emergency restrictions</label>
                                                    <input name="emergency_restrictions" type="checkbox" defaultChecked={safetyPolicies.emergency_restrictions} className="h-4 w-4 bg-slate-950 rounded border-slate-800 accent-brand-600" />
                                                </div>
                                                
                                                <button type="submit" disabled={safetyLoading} className="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded py-2 transition duration-200 mt-2">
                                                    Save Guardrails Configuration
                                                </button>
                                            </form>
                                        )}
                                    </div>

                                    {/* What-If Simulation Panel */}
                                    <div className="lg:col-span-2 border border-slate-900 bg-slate-900/20 rounded-xl p-5 space-y-4">
                                        <h3 className="text-sm font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-900 pb-3 flex items-center gap-1.5">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 text-brand-500"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                                            What-If Scenario Simulation Planner
                                        </h3>
                                        
                                        <div className="flex items-center gap-4 bg-slate-950/40 p-4 border border-slate-900 rounded-lg">
                                            <div className="flex-1 space-y-1">
                                                <label className="text-xs text-slate-400">What if transaction workload traffic surges by:</label>
                                                <div className="flex items-center gap-2">
                                                    <input type="number" value={whatIfScenario.traffic_increase_pct} onChange={(e) => setWhatIfScenario({ traffic_increase_pct: e.target.value })} className="bg-slate-950 border border-slate-800 rounded px-3 py-1.5 w-24 text-slate-200 font-mono text-xs" />
                                                    <span className="text-xs text-slate-400 dark:text-slate-500">% workload volume increase</span>
                                                </div>
                                            </div>
                                            <button onClick={() => runWhatIf()} disabled={safetyLoading} className="bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold py-2 px-4 rounded transition">
                                                Evaluate Scenario
                                            </button>
                                        </div>

                                        {whatIfResult && (
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                                                <div className="bg-slate-950/60 p-4 border border-slate-900 rounded-lg space-y-3 text-xs">
                                                    <div className="flex justify-between py-1.5 border-b border-slate-900/60">
                                                        <span className="text-slate-400">Current Configuration:</span>
                                                        <span className="font-mono text-slate-300">{whatIfResult.current_configuration.replicas} Replicas</span>
                                                    </div>
                                                    <div className="flex justify-between py-1.5 border-b border-slate-900/60">
                                                        <span className="text-slate-400">Simulated Configuration:</span>
                                                        <span className="font-mono text-emerald-400 font-bold">{whatIfResult.predicted_configuration.replicas} Replicas</span>
                                                    </div>
                                                    <div className="flex justify-between py-1.5 border-b border-slate-900/60">
                                                        <span className="text-slate-400">Hourly Cost Difference:</span>
                                                        <span className={`font-mono font-bold ${whatIfResult.cost_difference >= 0 ? 'text-pink-400' : 'text-emerald-400'}`}>
                                                            {whatIfResult.cost_difference >= 0 ? '+' : ''}{formatCurrencyVal(whatIfResult.cost_difference, selectedCurrency, true)}/hr
                                                            {selectedCurrency !== 'USD' && (
                                                                <span className="text-[10px] text-slate-500 block font-normal">
                                                                    ≈ {whatIfResult.cost_difference >= 0 ? '+' : ''}{formatCurrencyVal(whatIfResult.cost_difference, 'USD', true)}/hr
                                                                </span>
                                                            )}
                                                        </span>
                                                    </div>
                                                    <div className="flex justify-between py-1.5">
                                                        <span className="text-slate-400">Carbon Footprint Shift:</span>
                                                        <span className="font-mono text-slate-300">{whatIfResult.carbon_impact_ghr.toFixed(1)} g CO2/hr</span>
                                                    </div>
                                                </div>

                                                <div className="bg-slate-950/60 p-4 border border-slate-900 rounded-lg space-y-3 text-xs">
                                                    <div className="flex justify-between py-1.5 border-b border-slate-900/60">
                                                        <span className="text-slate-400">Projected SLA Impact:</span>
                                                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${whatIfResult.sla_impact === 'HEALTHY' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>
                                                            {whatIfResult.sla_impact}
                                                        </span>
                                                    </div>
                                                    <div className="flex justify-between py-1.5 border-b border-slate-900/60">
                                                        <span className="text-slate-400">Risk Assessment Index:</span>
                                                        <span className={`font-mono font-bold ${whatIfResult.risk === 'HIGH' ? 'text-rose-400' : 'text-emerald-400'}`}>{whatIfResult.risk}</span>
                                                    </div>
                                                    <div className="flex justify-between py-1.5">
                                                        <span className="text-slate-400">Recommended Action:</span>
                                                        <span className="font-bold text-brand-400 font-mono">{whatIfResult.recommended_action}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Immutable Safety Audit Trail Timeline */}
                                <div className="border border-slate-200 dark:border-slate-900 bg-white dark:bg-slate-900/10 rounded-xl p-5 space-y-4">
                                    <h3 className="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                                        Immutable Safety Policy Audit Timeline Feed
                                    </h3>
                                    
                                    <div className="bg-white dark:bg-slate-950/50 rounded-xl border border-slate-200 dark:border-slate-900 overflow-hidden">
                                        <table className="w-full text-left text-xs border-collapse">
                                            <thead>
                                                <tr className="border-b border-slate-200 dark:border-slate-800 text-slate-500 dark:text-slate-400 font-bold bg-slate-100 dark:bg-slate-900/30">
                                                    <th className="py-2.5 px-4">Timestamp</th>
                                                    <th className="py-2.5 px-4">Model Version</th>
                                                    <th className="py-2.5 px-4 text-center">Calculated Action</th>
                                                    <th className="py-2.5 px-4 text-center">Risk Level</th>
                                                    <th className="py-2.5 px-4 text-center">Safety Status</th>
                                                    <th className="py-2.5 px-4">Policy / Human Explanation</th>
                                                    <th className="py-2.5 px-4">Execution Status</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {safetyAuditLogs.length === 0 ? (
                                                    <tr>
                                                        <td colSpan="7" className="py-8 text-center text-slate-400 dark:text-slate-500 italic">No historical audit trails logged.</td>
                                                    </tr>
                                                ) : (
                                                    safetyAuditLogs.map((log, index) => (
                                                        <tr key={index} className="border-b border-slate-200 dark:border-slate-900 hover:bg-slate-50 dark:hover:bg-slate-900/10 text-slate-700 dark:text-slate-200">
                                                            <td className="py-3 px-4 font-mono text-slate-400 dark:text-slate-500">{log.timestamp.replace('T', ' ').split('.')[0]}</td>
                                                            <td className="py-3 px-4 font-mono text-slate-500 dark:text-slate-400">{log.model_version}</td>
                                                            <td className="py-3 px-4 text-center font-mono font-semibold text-brand-400">{log.action}</td>
                                                            <td className="py-3 px-4 text-center">
                                                                <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${log.risk_score === 'CRITICAL' || log.risk_score === 'HIGH' ? 'bg-rose-500/10 text-rose-400' : 'bg-emerald-500/10 text-emerald-400'}`}>
                                                                    {log.risk_score}
                                                                </span>
                                                            </td>
                                                            <td className="py-3 px-4 text-center">
                                                                <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${log.policy_result === 'PASSED' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>
                                                                    {log.policy_result}
                                                                </span>
                                                            </td>
                                                            <td className="py-3 px-4 text-slate-600 dark:text-slate-300 italic max-w-sm truncate" title={log.reason}>{log.reason}</td>
                                                            <td className="py-3 px-4 font-mono text-[10px] text-slate-500 dark:text-slate-400">{log.execution_result}</td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );

        }

        // Render React components to DOM root
        const rootElement = document.getElementById("root");
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
